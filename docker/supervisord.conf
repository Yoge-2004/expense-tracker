[supervisord]
user=root
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:python-ml]
command=/app/ml/.venv/bin/uvicorn expense_ml.api.main:app --host 127.0.0.1 --port 8000 --no-access-log --workers 1
directory=/app/ml
user=app
autorestart=true
startsecs=5
priority=20
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:spring-boot]
# Internal Spring Boot backend upstream on 127.0.0.1:8080
#
# --app.trusted-proxy.enabled=true: this process is only ever reached via
# nginx's loopback connection (see nginx.conf, server.address=127.0.0.1
# above), so remoteAddr is always nginx's own address for every request.
# Without this, the rate limiter's X-Forwarded-For-ignoring safe default
# (see RateLimitInterceptor) collapses every real-world user into a single
# shared rate-limit bucket keyed to 127.0.0.1. app.trusted-proxy.cidrs is
# left at its default (127.0.0.1/32,::1/128), which already matches nginx's
# own address here, so only enabling the flag is needed.
#
# --enable-native-access=ALL-UNNAMED: silences the restricted method warning
# emitted by SQLite JDBC when dynamically loading its native JNI driver on Java 27.
command=/opt/java/openjdk/bin/java -XX:+UseContainerSupport -XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError -XX:+UseZGC -XX:CICompilerCount=2 -Djava.security.egd=file:/dev/./urandom --enable-native-access=ALL-UNNAMED -Dfile.encoding=UTF-8 -Dspring.jmx.enabled=false -jar /app/app.jar --server.address=127.0.0.1 --server.port=8080 --app.trusted-proxy.enabled=true
user=app
autorestart=true
startsecs=10
priority=20
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autorestart=true
startsecs=2
priority=10
stopsignal=QUIT
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
