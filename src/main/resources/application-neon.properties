# Neon PostgreSQL Profile — Serverless-Optimized Configuration
# Activate with: --spring.profiles.active=neon
# Or set environment variable: SPRING_PROFILES_ACTIVE=neon

# ── Datasource ────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ── HikariCP — tuned for Neon's serverless autosuspend model ─────────────────
# Neon computes can cold-start: allow longer connection acquisition timeouts
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
# Socket timeout — prevents hung connections to suspended Neon compute
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.datasource.hikari.data-source-properties.connectTimeout=15
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.ApplicationName=ExpenseTrackerPro

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Neon manages SSL; disable local SSL validation (cert handled by driver)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── SQL Init ──────────────────────────────────────────────────────────────────
# Schema managed entirely by Hibernate ddl-auto on Neon
spring.sql.init.mode=never

# ── H2 Console ────────────────────────────────────────────────────────────────
spring.h2.console.enabled=false

# ─── Security ───────────────────────────────────────────────────────────────
# JWT_SECRET must be supplied via Hugging Face Space Secrets or environment variable in production
jwt.secret=${JWT_SECRET}

# ─── Logging ───────────────────────────────────────────────────────────────
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
