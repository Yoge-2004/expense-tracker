# ==============================================================================
# Development Profile Configuration (dev)
# ==============================================================================
spring.config.activate.on-profile=dev

# Server & Local Port
server.port=${SERVER_PORT:8080}

# Local Database Configuration (H2 File-based for persistence between restarts)
spring.datasource.url=jdbc:h2:file:./expensetracker_db;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Development JWT Secret (predetermined 384-bit key so start-backend.sh / manual export is not required)
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudC1vbmx5LTQ4LWJ5dGVzLWxvbmctZW5vdWdo
jwt.expiration=2592000000

# Permissive CORS for Local Development (Vite, Live Server, JetBrains Preview, Expo)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://localhost:8081,http://localhost:63342,http://127.0.0.1:3000,http://127.0.0.1:5500,http://127.0.0.1:8081,http://127.0.0.1:63342

# ML Backend Auto-Startup (automatically boots Python FastAPI ML service when Spring Boot starts)
ml.autostart.enabled=true
ml.inference.url=http://127.0.0.1:8000
ml.feedback.token=dev-ml-feedback-token

# OpenAPI / Swagger UI enabled in development
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Logging
logging.level.com.example.expensetracker=INFO
logging.level.org.springframework.web=INFO
