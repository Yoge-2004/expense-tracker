# ==============================================================================
# Production Profile Configuration (prod)
# ==============================================================================
spring.config.activate.on-profile=prod

# Server Port
server.port=${SERVER_PORT:8080}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./expensetracker_db;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# Console & Swagger Disabled for Production Hardening
spring.h2.console.enabled=false
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Strict CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://cozy-narwhal-3099ad.netlify.app}

# JWT Secret - Must be provided via environment or generated securely
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:2592000000}

# ML Inference Configuration (in prod container, supervisord manages the ML process)
ml.autostart.enabled=false
ml.inference.url=${ML_INFERENCE_URL:http://127.0.0.1:8000}
ml.feedback.token=${ML_FEEDBACK_TOKEN:}

# Hugging Face encrypted database failover
hf.db.space=${HF_SPACE_REPO:Yoge-2004/expense-tracker-backend}
hf.db.path=${HF_DB_PATH:database/expense_tracker.sqlite.enc}
hf.db.token=${HF_TOKEN:}
hf.db.encryption-key=${DB_BACKUP_KEY:}
hf.db.repo-type=${HF_REPO_TYPE:space}

# Logging
logging.level.com.example.expensetracker=INFO
logging.level.org.hibernate.SQL=WARN
