# Application
spring.application.name=Expense Tracker System
server.port=8080

# ── Active Profile ─────────────────────────────────────────────────────────────
# Use SPRING_PROFILES_ACTIVE=neon in production (Hugging Face Spaces)
# Use SPRING_PROFILES_ACTIVE=sqlite for local SQLite
# Default: H2 in-memory for local development

# ── Database Configuration ─────────────────────────────────────────────────────
# Defaults to H2 in-memory; overridden by profile (neon/sqlite) or env vars
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./expensetracker_db;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ── HikariCP Connection Pool ───────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=5000

# ── Cache Configuration ───────────────────────────────────────────────────────
spring.cache.type=concurrent

# ── H2 Console ─────────────────────────────────────────────────────────────────
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}

# ── Logging ─────────────────────────────────────────────────────────────────────
logging.level.org.hibernate.SQL=${LOG_HIBERNATE_SQL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_HIBERNATE_BINDER:WARN}
logging.level=com.example.expensetracker.service.FileDbSyncService=INFO

# ── CORS Configuration ──────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.netlify.app,https://cozy-narwhal-3099ad.netlify.app,https://*.hf.space,http://127.0.0.1:5500,http://localhost:5500,http://localhost:3000,http://localhost:63342,http://127.0.0.1:63342,http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,http://172.*:*,exp://*:*}

# ── Security ───────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Keep users signed in for 30 days by default. Override with JWT_EXPIRATION in production as needed.
jwt.expiration=${JWT_EXPIRATION:2592000000}

# ── Google OAuth ────────────────────────────────────────────────────────────────
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:487469737581-k1idcre171eknatam925igofmc6jtk00.apps.googleusercontent.com}

# ── Email & OTP Verification Toggles ──────────────────────────────────────────
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.auth.email-verification-enabled=${EMAIL_VERIFICATION_ENABLED:false}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Hugging Face Spaces Sync ───────────────────────────────────────────────────
hf.token=${HF_TOKEN:}
hf.space.repo=${HF_SPACE_REPO:Yoge-2004/expense-tracker-backend}
hf.sync.enabled=${HF_SYNC_ENABLED:false}

# ── Web Resource Cache (via WebMvcConfig) ──────────────────────────────────────
app.cache.static-max-age=${STATIC_CACHE_MAX_AGE:86400}
app.sync.secret-key=${SYNC_SECRET_KEY:}

# ── WebAuthn / Passkeys ────────────────────────────────────────────────────────
# The browser origin is the Netlify frontend. Override both values for another deployment.
app.webauthn.rp-id=${WEBAUTHN_RP_ID:cozy-narwhal-3099ad.netlify.app}
app.webauthn.origin=${WEBAUTHN_ORIGIN:https://cozy-narwhal-3099ad.netlify.app}
