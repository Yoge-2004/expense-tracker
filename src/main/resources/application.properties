# Application
spring.application.name=Expense Tracker System
server.port=8080

# ── Active Profile ─────────────────────────────────────────────────────────────
# Use SPRING_PROFILES_ACTIVE=neon in production (Hugging Face Spaces)
# Use SPRING_PROFILES_ACTIVE=sqlite for local SQLite
# Default: H2 in-memory for local development

# ── Database Configuration ─────────────────────────────────────────────────────
# Defaults to H2 in-memory; overridden by profile (neon/sqlite) or env vars
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:expensetrackerdb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ── HikariCP Connection Pool ───────────────────────────────────────────────────
# Neon-friendly defaults (also good for H2/SQLite)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=5000

# ── Cache Configuration ───────────────────────────────────────────────────────
# Named caches are configured in CacheConfig.java (userExpenses, globalCategories,
# userCategories, budgetStatus). Uses ConcurrentMapCacheManager (in-memory, JVM-local).
# To use Redis instead: set SPRING_CACHE_TYPE=redis and add spring-boot-starter-data-redis.
spring.cache.type=concurrent

# ── H2 Console ─────────────────────────────────────────────────────────────────
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CRITICAL: Ensures data.sql runs AFTER tables are created
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}

# ── Logging ─────────────────────────────────────────────────────────────────────
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.expensetracker.service.FileDbSyncService=INFO

# ── CORS Configuration ──────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500,http://localhost:3000,http://localhost:63342,http://127.0.0.1:63342,http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,http://172.*:*,exp://*:*}

# ── Security ───────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# ── Google OAuth ────────────────────────────────────────────────────────────────
# Get a real OAuth 2.0 Client ID (type "Web application") from
# https://console.cloud.google.com/apis/credentials, add your frontend origin(s)
# under "Authorized JavaScript origins", then set this via env var.
# If left blank, Google Sign-In fails closed (disabled) rather than accepting
# unverifiable tokens — see GoogleIdTokenVerifier.
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}

# ── Email (password reset OTPs) ────────────────────────────────────────────────
# If spring.mail.host is left blank, no email is actually sent — the OTP is
# logged to the server console instead (dev-only fallback), so you can finish
# testing the flow before wiring up real SMTP. Configure a real provider
# (Gmail app password, SendGrid, Mailgun, etc.) before deploying to production.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Hugging Face Spaces Sync ───────────────────────────────────────────────────
# HF_TOKEN and HF_SPACE_REPO are set as secrets in Hugging Face Space settings
hf.token=${HF_TOKEN:}
hf.space.repo=${HF_SPACE_REPO:yoge-2004/expense-tracker-backend}
hf.sync.enabled=${HF_SYNC_ENABLED:false}

# ── Web Resource Cache (via WebMvcConfig) ──────────────────────────────────────
# Static assets cache max-age in seconds (1 day = 86400, 1 week = 604800)
app.cache.static-max-age=${STATIC_CACHE_MAX_AGE:86400}