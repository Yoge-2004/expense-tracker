# Application
spring.application.name=Expense Tracker System
server.port=8080

# Modern protocol support: HTTP/2 with HTTP/1.1 fallback across all supported devices
server.http2.enabled=true
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
server.ssl.protocol=TLS

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=2048

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Default active profile: 'dev' for local developer productivity, override with 'prod' in production
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Enable virtual threads (Loom) for high-throughput non-blocking request execution
spring.threads.virtual.enabled=true
spring.task.execution.thread-name-prefix=async-vt-
spring.task.scheduling.thread-name-prefix=sched-vt-
spring.task.scheduling.pool.size=5

# ── Database Configuration ─────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./expensetracker_db;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=5000

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=15m
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}

logging.level.org.hibernate.SQL=${LOG_HIBERNATE_SQL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_HIBERNATE_BINDER:WARN}
logging.level.com.example.expensetracker.infrastructure.resilience.FileDbSyncService=INFO
logging.level.com.example.expensetracker.infrastructure.resilience.HuggingFaceDatabaseFailoverService=INFO

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://cozy-narwhal-3099ad.netlify.app}

jwt.secret=${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktNDgtYnl0ZXMtbG9uZy1lbm91Z2g=}
jwt.expiration=${JWT_EXPIRATION:2592000000}
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:487469737581-k1idcre171eknatam925igofmc6jtk00.apps.googleusercontent.com}

app.mail.enabled=${APP_MAIL_ENABLED:false}
app.auth.email-verification-enabled=${EMAIL_VERIFICATION_ENABLED:false}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Hugging Face encrypted database failover ───────────────────────────────────
hf.db.space=${HF_SPACE_REPO:Yoge-2004/expense-tracker-backend}
hf.db.path=${HF_DB_PATH:database/expense_tracker.sqlite.enc}
hf.db.token=${HF_TOKEN:}
hf.db.encryption-key=${DB_BACKUP_KEY:}
hf.db.repo-type=${HF_REPO_TYPE:space}
hf.db.backup-cron=${HF_DB_BACKUP_CRON:0 0 * * * *}

# ── Demo data seeding (opt-in; never seeded without an explicit password) ─────
app.demo.seed-enabled=${APP_DEMO_SEED_ENABLED:false}
app.demo.password=${APP_DEMO_PASSWORD:}

# ── Local H2 failover store ───────────────────────────────────────────────────
app.fallback-db.password=${FALLBACK_DB_PASSWORD:}

# ── ML continuous learning & Inference ─────────────────────────────────────────
ml.autostart.enabled=${ML_AUTOSTART_ENABLED:false}
ml.feedback.token=${ML_FEEDBACK_TOKEN:}
ml.inference.url=${ML_INFERENCE_URL:http://127.0.0.1:8000}

app.cache.static-max-age=${STATIC_CACHE_MAX_AGE:86400}
app.sync.secret-key=${SYNC_SECRET_KEY:}
# Tokenless sync access for local cron/scripts. KEEP FALSE behind any reverse
# proxy: with the proxy in front, every request appears to come from loopback.
app.sync.loopback-bypass-enabled=${SYNC_LOOPBACK_BYPASS_ENABLED:false}

app.webauthn.rp-id=${WEBAUTHN_RP_ID:cozy-narwhal-3099ad.netlify.app}
app.webauthn.origin=${WEBAUTHN_ORIGIN:https://cozy-narwhal-3099ad.netlify.app}

# ── Multipart Upload Limits ───────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
spring.servlet.multipart.file-size-threshold=2MB

# ── OpenAPI / Swagger ─────────────────────────────────────────────────────────
# The /swagger-ui/** and /v3/api-docs endpoints are permitAll for local docs and
# client generation. Set SWAGGER_ENABLED=false on internet-facing deployments to
# avoid publishing the complete API schema.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# Swagger UI layout: readable ordering, collapsed sections, request timing, kept login.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.default-models-expand-depth=0
springdoc.swagger-ui.default-model-expand-depth=2
springdoc.swagger-ui.syntax-highlight.theme=agate
springdoc.writer-with-order-by-keys=true
springdoc.swagger-ui.urls-primary-name=All endpoints

# API groups: one dropdown entry per product area. "all" keeps the complete spec available.
springdoc.group-configs[0].group=all
springdoc.group-configs[0].display-name=All endpoints
springdoc.group-configs[0].paths-to-match=/api/**
springdoc.group-configs[1].group=auth-account
springdoc.group-configs[1].display-name=Auth & Account
springdoc.group-configs[1].paths-to-match=/api/auth/**,/api/users/**,/api/webauthn/**
springdoc.group-configs[2].group=expenses
springdoc.group-configs[2].display-name=Expenses & Categories
springdoc.group-configs[2].paths-to-match=/api/expenses/**,/api/categories/**
springdoc.group-configs[3].group=income-savings-loans
springdoc.group-configs[3].display-name=Income, Savings & Loans
springdoc.group-configs[3].paths-to-match=/api/incomes/**,/api/savings/**,/api/loans/**
springdoc.group-configs[4].group=reports
springdoc.group-configs[4].display-name=Reports
springdoc.group-configs[4].paths-to-match=/api/reports/**
springdoc.group-configs[5].group=ml-insights
springdoc.group-configs[5].display-name=ML & Insights
springdoc.group-configs[5].paths-to-match=/api/ml/**,/api/internal/ml/**
springdoc.group-configs[6].group=notifications-sync
springdoc.group-configs[6].display-name=Notifications & Sync
springdoc.group-configs[6].paths-to-match=/api/notifications/**,/api/sync/**
springdoc.group-configs[7].group=admin-ops
springdoc.group-configs[7].display-name=Admin & Operations
springdoc.group-configs[7].paths-to-match=/api/admin/**,/api/health/**

# Notifications: when the daily/weekly jobs run (the user's morning, not the server's) and an off switch
app.notifications.zone=${NOTIFICATIONS_ZONE:Asia/Kolkata}
app.notifications.scheduler.enabled=${NOTIFICATIONS_ENABLED:true}

# ── Admin Clearance & Super Admin Bootstrapping ────────────────────────────
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
app.admin.bootstrap.email=${ADMIN_EMAIL:}
app.admin.bootstrap.username=${ADMIN_USERNAME:}
app.admin.bootstrap.password=${ADMIN_PASSWORD:}
app.admin.bootstrap.pin=${ADMIN_PIN:}

# ── Spring Boot Actuator & Observability ─────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
management.info.env.enabled=true
