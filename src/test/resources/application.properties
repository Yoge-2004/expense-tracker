# ── Spring Application ────────────────────────────────────────────────────────
spring.application.name=Expense Tracker System (Test)
spring.main.banner-mode=off

# ── Datasource (In-Memory H2) ─────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false

# ── SQL Initialization ────────────────────────────────────────────────────────
spring.sql.init.mode=never

# ── JWT Security ──────────────────────────────────────────────────────────────
jwt.secret=TestSecretKeyForJWTSigningMustBeAtLeast256BitsLongForHS256Algorithm
jwt.expiration=86400000

# ── Documentation (Disabled during tests) ───────────────────────────────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.example.expensetracker=INFO
logging.level.org.springframework.web=INFO
