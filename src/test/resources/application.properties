# ═══════════════════════════════════════════════════════════════════════════
# Test application.properties
# ═══════════════════════════════════════════════════════════════════════════
# FIXED: slice tests (@WebMvcTest) load the security filter chain which depends on
# JwtAuthenticationFilter -> JwtService. JwtService.@PostConstruct init() requires
# a valid jwt.secret of >=32 bytes. Without this file, the secret was unset and
# init() threw IllegalStateException, causing "bean of type JwtService could not
# be found" errors in SyncControllerTest (9 errors) and RangeReportControllerTest.
#
# This file provides a deterministic test-only secret (NOT a production secret).
# It is a base64-encoded 48-byte key — well above the 32-byte HS256 minimum.
# ═══════════════════════════════════════════════════════════════════════════

# Test-only JWT secret: base64 of 48 random bytes (NOT for production use)
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktNDgtYnl0ZXMtbG9uZy1lbm91Z2g=
jwt.expiration=3600000

# Disable mail for tests
app.mail.enabled=false
app.auth.email-verification-enabled=false

# Disable rate limiting for tests so Cucumber scenarios can run in rapid succession
app.security.rate-limit.enabled=false

# H2 in-memory for any integration tests that load the full context
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# Google OAuth (dummy for tests)
google.oauth.client-id=test-client-id
