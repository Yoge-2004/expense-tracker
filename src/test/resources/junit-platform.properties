# ═══════════════════════════════════════════════════════════════════════════
# JUnit Platform properties for Cucumber test engine
# ═══════════════════════════════════════════════════════════════════════════
# These properties configure the Cucumber JUnit Platform engine.
# The CucumberTestRunner class uses @Suite + @IncludeEngines("cucumber")
# to trigger this engine.

# Glue package — where Cucumber looks for step definitions
cucumber.glue=com.example.expensetracker.cucumber

# Feature files location
cucumber.features=classpath:features

# Plugins — pretty console output + HTML report
cucumber.plugin=pretty,summary,html:target/cucumber-report/cucumber-report.html

# Do not run scenarios tagged @ignore
cucumber.filter.tags=not @ignore
