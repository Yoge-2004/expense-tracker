# Category-classification datasets for Phase 1.
# Raw data is downloaded by the Hugging Face datasets library and is never
# committed to this repository.
#
# FinEE (Ranjit0034/finee-dataset) is intentionally excluded here because it
# is primarily an entity-extraction dataset. Its structured output will be
# used by the future transaction extraction/NER phase instead of mixing it
# into the category-classification training set.

datasets:
  - source: global-transaction-categorization
    dataset_id: mitulshah/transaction-categorization
    split: train
    text_column: transaction_description
    label_column: category

  - source: synthetic-indian-transactions
    dataset_id: Sumeetgpt/indian-transaction-categorization-synthetic
    split: train
    text_column: text
    label_column: category
