# Public datasets used by the category-classification phase.
# Raw data is downloaded by the Hugging Face datasets library and is never
# committed to this repository.

datasets:
  - source: global-transaction-categorization
    dataset_id: mitulshah/transaction-categorization
    split: train
    text_column: transaction_description
    label_column: category

  - source: finee-india
    dataset_id: Ranjit0034/finee-dataset
    split: train
    text_column: input
    label_column: output.category

  - source: synthetic-indian-transactions
    dataset_id: Sumeetgpt/indian-transaction-categorization-synthetic
    split: train
    text_column: text
    label_column: category
