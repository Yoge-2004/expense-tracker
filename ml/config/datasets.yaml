# Category-classification datasets for the Expense Intelligence training pipeline.
# Raw data is downloaded by the Hugging Face datasets library and is never
# committed to this repository.
#
# The global dataset provides cross-country coverage (USA, UK, Canada,
# Australia, India). FinEE adds Indian banking-message coverage, including
# multilingual transaction narrations. The synthetic Indian dataset adds
# explicit Indian narration/category examples.

datasets:
  - source: global-transaction-categorization
    dataset_id: mitulshah/transaction-categorization
    split: train
    text_column: transaction_description
    label_column: category

  - source: finee-india
    dataset_id: Ranjit0034/finee-dataset
    split: train
    format: finee-chatml
    text_column: messages
    label_column: messages

  - source: synthetic-indian-transactions
    dataset_id: Sumeetgpt/indian-transaction-categorization-synthetic
    split: train
    text_column: text
    label_column: category
