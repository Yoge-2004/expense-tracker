# Training datasets for the Expense Intelligence category classifier.
# Every source is normalized into the explicit canonical taxonomy in
# expense_ml.data.taxonomy. Unknown source labels fail preparation.
# Raw datasets are never committed to Git.

datasets:
  - source: global-transaction-categorization
    dataset_id: mitulshah/transaction-categorization
    split: train
    text_column: transaction_description
    label_column: category
    country_column: country
    currency_column: currency
    normalize_chunk_size: 250000

  - source: finee-india
    dataset_id: Ranjit0034/finee-dataset
    split: train
    format: finee-chatml
    text_column: messages
    label_column: messages
    default_country: India
    default_currency: INR
    default_language: multilingual
    normalize_chunk_size: 25000

  - source: synthetic-indian-transactions
    dataset_id: Sumeetgpt/indian-transaction-categorization-synthetic
    split: train
    text_column: text
    label_column: category
    default_country: India
    default_currency: INR
    default_language: en
    normalize_chunk_size: 25000
