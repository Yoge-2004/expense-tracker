automation:
  schedule: "0 2 * * *"
  feedback_threshold: 500
  max_feedback_page_size: 1000
  require_training_status: eligible
  model_repository: "Yoge-2004/expense-intelligence-model"
  production_revision: "production"
  candidate_revision_prefix: "v"
  private_model_repository: true

secrets:
  feedback_token_env: EXPENSE_ML_FEEDBACK_TOKEN
  huggingface_token_env: HF_TOKEN

endpoints:
  feedback_base_url_env: EXPENSE_ML_FEEDBACK_URL

artifacts:
  output_dir_env: EXPENSE_ML_OUTPUT
  prepared_path_env: EXPENSE_ML_PREPARED
  config_path_env: EXPENSE_ML_CONFIG
