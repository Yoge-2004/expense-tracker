[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker-ml"
version = "0.2.0"
description = "Offline and automated ML training/inference pipeline for Expense Tracker transaction intelligence"
requires-python = ">=3.14,<3.15"
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=2.3,<3",
  "pandas>=3.1,<4",
  "pyarrow>=26,<27",
  "pyyaml>=6,<7",
  "scikit-learn>=1.9,<2",
]

[project.optional-dependencies]
classical = [
  "datasets>=5,<6",
  "huggingface-hub>=2.4,<3",
  "matplotlib>=3.10,<4",
  "scipy>=1.16,<2",
  "tqdm>=4.67,<5",
]
train = [
  "accelerate>=1.15,<2",
  "datasets>=5,<6",
  "huggingface-hub>=2.4,<3",
  "matplotlib>=3.10,<4",
  "scipy>=1.16,<2",
  "torch>=2.14,<3",
  "tqdm>=4.67,<5",
  "transformers>=5.17,<6",
]
serve = [
  "fastapi>=0.141,<1",
  "huggingface-hub>=2.4,<3",
  "torch>=2.14,<3",
  "transformers>=5.17,<6",
  "uvicorn[standard]>=0.53,<1",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.2,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
expense-ml = "expense_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["notebooks"]
