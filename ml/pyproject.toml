[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker-ml"
version = "0.1.0"
description = "Offline ML training pipeline for Expense Tracker transaction intelligence"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2",
  "numpy==2.3.3",
  "pandas==2.3.3",
  "pyyaml>=6.0,<7",
  "scipy==1.16.2",
  "scikit-learn==1.7.2",
  "datasets==4.8.5",
  "transformers==5.0.0",
  "torch==2.10.0",
  "accelerate==1.15.0",
  "evaluate>=0.4,<1",
  "matplotlib>=3.9,<4",
  "tqdm>=4.67,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
expense-ml = "expense_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/expense_ml/master_pipeline.py" = ["F401"]
