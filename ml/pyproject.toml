[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker-ml"
version = "0.1.0"
description = "Offline ML training pipeline for Expense Tracker transaction intelligence"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyyaml>=6.0,<7",
  "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2",
  "datasets>=3.2,<5",
  "transformers>=4.47,<6",
  "torch>=2.5,<3",
  "accelerate>=1.2,<2",
  "evaluate>=0.4,<1",
  "matplotlib>=3.9,<4",
  "tqdm>=4.67,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
expense-ml = "expense_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
