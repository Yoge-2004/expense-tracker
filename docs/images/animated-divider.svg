<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="24">
  <defs>
    <linearGradient id="divBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C79A3E" stop-opacity="0"/>
      <stop offset="20%" stop-color="#C79A3E" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#F3E5AB" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#C79A3E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C79A3E" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="pulseSpark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF2B2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFF2B2" stop-opacity="0"/>
    </linearGradient>

    <style>
      @keyframes travelSpark {
        0% { transform: translateX(-400px); }
        100% { transform: translateX(1200px); }
      }
      .spark-line {
        animation: travelSpark 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- Static Track -->
  <line x1="50" y1="12" x2="1150" y2="12" stroke="url(#divBg)" stroke-width="1.5"/>

  <!-- Traveling Dynamic Spark -->
  <g class="spark-line">
    <ellipse cx="0" cy="12" rx="120" ry="2" fill="url(#pulseSpark)"/>
    <circle cx="0" cy="12" r="3" fill="#FFFFFF"/>
  </g>
</svg>
