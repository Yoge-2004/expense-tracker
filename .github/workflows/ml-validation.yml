name: ML Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ml/**'
      - '.github/workflows/ml-validation.yml'
  push:
    branches: [main]
    paths:
      - 'ml/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "latest-known"
          python-version: "3.14"
          enable-cache: true
          working-directory: ml

      - name: Install ML dependencies
        run: uv sync --all-extras --dev

      - name: Ruff
        run: uv run ruff check src tests jobs --select E9,F

      - name: Pytest
        run: uv run pytest -q
