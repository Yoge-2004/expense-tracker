name: One-off base CSS semantic split
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  split:
    if: "!contains(github.event.head_commit.message, '[base-css-split]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split base.css by semantic boundaries
        shell: python
        run: |
          from pathlib import Path

          root = Path('frontend/css')
          source = root / 'base.css'
          text = source.read_text(encoding='utf-8')

          toggle = '/* ==========================================================================\n   TOGGLE SWITCH COMPONENT (ALL SIZES & MODALS)\n   ========================================================================== */'
          income = '/* ==========================================================================\n   INCOME MODAL EMERALD THEME & OUTLINES & GLOW EFFECTS\n   ========================================================================== */'

          toggle_index = text.find(toggle)
          income_index = text.find(income)
          if toggle_index <= 0 or income_index <= toggle_index:
              raise SystemExit('Expected base.css semantic boundaries were not found; refusing to modify.')

          foundation = text[:toggle_index].rstrip() + '\n'
          toggle_text = text[toggle_index:income_index].rstrip() + '\n'
          income_text = text[income_index:].rstrip() + '\n'

          (root / 'base').mkdir(exist_ok=True)
          (root / 'base' / 'foundation.css').write_text(foundation, encoding='utf-8')
          (root / 'base' / 'toggle.css').write_text(toggle_text, encoding='utf-8')
          (root / 'base' / 'income-modal.css').write_text(income_text, encoding='utf-8')

          source.write_text(
              '/* EXPENSE TRACKER — BASE.CSS */\n'
              '/* Foundation rules are split by responsibility while preserving cascade order. */\n'
              '@import url("base/foundation.css");\n'
              '@import url("base/toggle.css");\n'
              '@import url("base/income-modal.css");\n',
              encoding='utf-8',
          )

          # Ensure every extracted module has balanced CSS braces.
          for path in [root / 'base' / 'foundation.css', root / 'base' / 'toggle.css', root / 'base' / 'income-modal.css']:
              s = path.read_text(encoding='utf-8')
              if s.count('{') != s.count('}'):
                  raise SystemExit(f'Unbalanced braces in {path}: {s.count("{")} opens, {s.count("}")} closes')

          if source.read_text(encoding='utf-8').count('@import') != 3:
              raise SystemExit('base.css manifest does not contain exactly three imports')

      - name: Remove one-off workflow
        run: rm .github/workflows/one-off-base-css-split.yml

      - name: Commit semantic split
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/css/base.css frontend/css/base/foundation.css frontend/css/base/toggle.css frontend/css/base/income-modal.css
          git rm .github/workflows/one-off-base-css-split.yml
          git diff --cached --check
          git commit -m 'refactor(css): split base styles by responsibility [base-css-split]'
          git push
