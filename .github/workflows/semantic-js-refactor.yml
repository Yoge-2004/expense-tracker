name: Semantic dashboard insights extraction

on:
  push:
    branches: [refactor/js-dashboard-insights]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Extract dashboard insights controller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          dashboard = Path('frontend/js/dashboard.js')
          html = Path('frontend/dashboard.html')
          module = Path('frontend/js/modules/dashboard-insights.js')

          src = dashboard.read_text(encoding='utf-8')
          marker = 'function renderFinancialInsights(expenses) {'
          start = src.find(marker)
          if start < 0:
              raise SystemExit('renderFinancialInsights definition not found')

          # Find the matching closing brace without parsing JavaScript.
          brace = src.find('{', start)
          depth = 0
          end = None
          for i in range(brace, len(src)):
              ch = src[i]
              if ch == '{':
                  depth += 1
              elif ch == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('Could not find renderFinancialInsights closing brace')

          function = src[start:end]
          function = function.replace('function renderFinancialInsights(expenses)', 'function renderFinancialInsights(expenses, incomes, goals)', 1)
          function = function.replace(
              'const safeIncomes = (window.allIncomes && window.allIncomes.length > 0) ? window.allIncomes : (Array.isArray(allIncomes) ? allIncomes : []);',
              'const safeIncomes = Array.isArray(incomes) ? incomes : [];'
          )
          function = function.replace(
              'const safeGoals = (window.allSavingsGoals && window.allSavingsGoals.length > 0) ? window.allSavingsGoals : (Array.isArray(allSavingsGoals) ? allSavingsGoals : []);',
              'const safeGoals = Array.isArray(goals) ? goals : [];'
          )
          function = function.replace(
              'const safeExpenses = (window.allExpenses && window.allExpenses.length > 0) ? window.allExpenses : (Array.isArray(expenses) ? expenses : (allExpenses || []));',
              'const safeExpenses = Array.isArray(expenses) ? expenses : [];'
          )

          module.write_text(
              '/* Financial intelligence renderer for the dashboard. */\n'
              '(function () {\n'
              '    "use strict";\n\n'
              '    const { formatCurrency, escapeHtml } = window.DashboardUtils;\n\n'
              f'    {function.replace(chr(10), chr(10) + "    ").rstrip()}\n\n'
              '    window.DashboardInsights = Object.freeze({ renderFinancialInsights });\n'
              '})();\n',
              encoding='utf-8'
          )

          # Replace the in-file controller with a compatibility wrapper.
          replacement = (
              'function renderFinancialInsights(expenses) {\n'
              '    return window.DashboardInsights.renderFinancialInsights(\n'
              '        expenses,\n'
              '        allIncomes,\n'
              '        allSavingsGoals\n'
              '    );\n'
              '}\n\n'
              'window.renderFinancialInsights = renderFinancialInsights;'
          )
          # Preserve the existing global export when present.
          src = src[:start] + replacement + src[end:]
          src = src.replace('window.renderFinancialInsights = renderFinancialInsights;', '', 1)
          src = src.replace(replacement.split('\n\n')[0], replacement.split('\n\n')[0], 1)
          # Ensure wrapper has the global compatibility export exactly once.
          wrapper_marker = 'function renderFinancialInsights(expenses) {\n    return window.DashboardInsights.renderFinancialInsights(\n        expenses,\n        allIncomes,\n        allSavingsGoals\n    );\n}\n'
          if wrapper_marker not in src:
              raise SystemExit('Wrapper insertion failed')
          src = src.replace(wrapper_marker, wrapper_marker + '\nwindow.renderFinancialInsights = renderFinancialInsights;\n', 1)
          dashboard.write_text(src, encoding='utf-8')

          page = html.read_text(encoding='utf-8')
          tag = '<script src="js/modules/dashboard-insights.js"></script>'
          if tag not in page:
              anchor = '<script src="js/modules/dashboard-metrics.js"></script>'
              if anchor not in page:
                  raise SystemExit('dashboard module anchor not found')
              page = page.replace(anchor, tag + '\n    ' + anchor, 1)
              html.write_text(page, encoding='utf-8')
          PY
      - name: Validate extracted JavaScript
        run: |
          set -euo pipefail
          find frontend/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit extraction and remove temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/semantic-js-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/js/dashboard.js frontend/js/modules/dashboard-insights.js frontend/dashboard.html
          git commit -m "refactor(js): extract dashboard financial insights"
          git push origin HEAD:refactor/js-dashboard-insights
