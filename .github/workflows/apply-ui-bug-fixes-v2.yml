name: Apply UI Bug Fixes v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ui-bug-fixes-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply targeted UI fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          (root / 'frontend/css/ui-bug-fixes.css').write_text(r'''/* Targeted UI corrections for auth and dashboard regressions. */
.budget-bar-fill {
    position: relative !important;
    inset: auto !important;
    min-width: 0 !important;
    max-width: 100% !important;
    overflow: hidden !important;
}
.budget-bar-fill::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.32), transparent);
    background-size: 200% 100%;
    animation: shimmerSweep 2.8s infinite linear;
    pointer-events: none;
}
.google-oauth-wrapper { isolation: isolate; }
.google-oauth-wrapper #googleOAuthBtn { z-index: 1 !important; }
.google-oauth-wrapper #googleRealButton { display: none !important; }
.google-oauth-wrapper #googleOAuthBtn svg { display: block !important; flex: 0 0 auto !important; width: 18px !important; height: 18px !important; }
.top-bar .add-income-button svg,
.top-bar .add-expense-button svg,
#openIncomeModalBtn svg,
#addIncomeTableBtn svg { display: block !important; flex: 0 0 auto !important; visibility: visible !important; }
.ledger-stream-tabs {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    overflow-x: auto !important;
    overflow-y: hidden !important;
    box-sizing: border-box !important;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
}
.stream-pill-btn { flex: 0 0 auto !important; min-width: max-content !important; white-space: nowrap !important; box-sizing: border-box !important; }
.stream-badge-count { flex: 0 0 auto !important; min-width: 2ch !important; text-align: center !important; white-space: nowrap !important; }
.ledger-column { min-width: 0 !important; box-sizing: border-box !important; }
#expenseList, #incomeList { min-width: 0 !important; }
.expense-item {
    box-sizing: border-box !important;
    min-width: 0 !important;
    display: grid !important;
    grid-template-columns: auto minmax(0, 1fr) auto !important;
    align-items: center !important;
    gap: 12px !important;
    margin: 0 0 8px !important;
    padding: 12px 14px !important;
    border: 1px solid var(--border) !important;
    border-radius: 14px !important;
    background: rgba(var(--ink-rgb), 0.025) !important;
}
.expense-item:hover { transform: translateY(-1px); }
.expense-emoji-box { width: 40px !important; height: 40px !important; }
.expense-info, .expense-actions { min-width: 0 !important; }
.expense-info h4, .expense-title { margin: 0 !important; overflow-wrap: anywhere; }
.expense-actions { display: flex !important; align-items: center !important; justify-content: flex-end !important; gap: 6px !important; flex-wrap: nowrap !important; }
#incomeList table { width: 100% !important; border-collapse: separate !important; border-spacing: 0 8px !important; }
#incomeList tbody tr { background: rgba(var(--ink-rgb), 0.025) !important; box-shadow: inset 0 0 0 1px var(--border) !important; }
#incomeList tbody td { border: 0 !important; }
#incomeList tbody tr td:first-child { border-radius: 14px 0 0 14px !important; }
#incomeList tbody tr td:last-child { border-radius: 0 14px 14px 0 !important; }
.subs-tab-btn {
    min-height: 38px !important;
    box-sizing: border-box !important;
    border: 1px solid transparent !important;
    outline: none !important;
    -webkit-tap-highlight-color: transparent !important;
}
.subs-tab-btn:active { transform: none !important; }
.subs-tab-btn:focus { outline: none !important; box-shadow: none !important; }
.subs-tab-btn:focus-visible { outline: 2px solid color-mix(in srgb, var(--primary) 60%, transparent) !important; outline-offset: 2px; }
button, a, [role="button"] { -webkit-tap-highlight-color: transparent; }
@media (max-width: 700px) {
    .unified-ledger-grid { grid-template-columns: minmax(0,1fr) !important; min-width: 0 !important; }
    .ledger-column + .ledger-column { margin-top: 18px !important; }
    .expense-item { grid-template-columns: auto minmax(0,1fr) !important; }
    .expense-actions { grid-column: 2; justify-content: flex-start !important; margin-top: -2px; }
    #incomeList table, #incomeList thead, #incomeList tbody, #incomeList tr, #incomeList td { display: block !important; width: 100% !important; box-sizing: border-box !important; }
    #incomeList thead { display: none !important; }
    #incomeList tbody tr { margin-bottom: 8px !important; padding: 10px 12px !important; border-radius: 14px !important; }
    #incomeList tbody td { padding: 4px 0 !important; border-radius: 0 !important; }
}
@media (max-width: 480px) {
    .profile-menu { position: fixed !important; top: 60px !important; left: 12px !important; right: 12px !important; width: auto !important; max-width: none !important; min-width: 0 !important; max-height: calc(100vh - 76px) !important; overflow-y: auto !important; box-sizing: border-box !important; z-index: 5000 !important; }
    .profile-menu a { min-width: 0 !important; overflow-wrap: anywhere !important; }
}
''', encoding='utf-8')

          style = root / 'frontend/css/style.css'
          style_text = style.read_text(encoding='utf-8')
          marker = '@import url("ui-bug-fixes.css");'
          if marker not in style_text:
              style.write_text(style_text.rstrip() + '\n' + marker + '\n', encoding='utf-8')

          runtime = root / 'frontend/js/ui-bug-fixes.js'
          runtime.write_text(r'''/* Runtime fixes for theme icon synchronization and idle dashboard refreshes. */
(function () {
    'use strict';
    function syncThemeIcons() {
        const theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        if (typeof window.updateAllThemeIcons === 'function') {
            window.updateAllThemeIcons(theme);
            return;
        }
        document.querySelectorAll('.theme-toggle-btn, #themeToggle').forEach(button => {
            const sun = button.querySelector('.sun-icon');
            const moon = button.querySelector('.moon-icon');
            if (!sun || !moon) return;
            const light = theme === 'light';
            sun.style.display = light ? 'none' : 'block';
            moon.style.display = light ? 'block' : 'none';
            button.setAttribute('aria-label', light ? 'Switch to Dark Theme' : 'Switch to Light Theme');
            button.setAttribute('title', light ? 'Switch to Dark Theme' : 'Switch to Light Theme');
        });
    }

    function install() {
        syncThemeIcons();
        document.addEventListener('themechange', syncThemeIcons);
        if (typeof MutationObserver !== 'undefined') {
            new MutationObserver(records => {
                if (records.some(r => r.type === 'attributes' && r.attributeName === 'data-theme')) syncThemeIcons();
            }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
        }

        if (typeof window.loadDashboard === 'function') {
            const original = window.loadDashboard;
            if (!original.__idleRefreshGuard) {
                let mutationPending = false;
                const mutationSelectors = [
                    '#addExpenseForm button[type="submit"]', '#incomeForm button[type="submit"]',
                    '#addBudgetForm button[type="submit"]', '#editSubForm button[type="submit"]',
                    '#securityPinForm button[type="submit"]', '.btn-delete', '.btn-edit'
                ].join(',');
                const markMutation = () => {
                    mutationPending = true;
                    window.setTimeout(() => { mutationPending = false; }, 30000);
                };
                document.addEventListener('click', e => { if (e.target?.closest?.(mutationSelectors)) markMutation(); }, true);
                document.addEventListener('submit', markMutation, true);
                function guardedLoadDashboard(skipCache) {
                    if (skipCache === true && !mutationPending) return Promise.resolve();
                    mutationPending = false;
                    return original.apply(this, arguments);
                }
                guardedLoadDashboard.__idleRefreshGuard = true;
                window.loadDashboard = guardedLoadDashboard;
            }
        }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', install, { once: true });
    else install();
})();
''', encoding='utf-8')

          dashboard = root / 'frontend/js/dashboard.js'
          text = dashboard.read_text(encoding='utf-8')
          pattern = re.compile(r'\n// Periodic background sync every 25 seconds\s*setInterval\(\(\) => \{\s*if \(document\.visibilityState === "visible"\) \{\s*loadDashboard\(true\);\s*\}\s*\}, 25000\);\s*', re.MULTILINE)
          new_text, count = pattern.subn('\n// Dashboard data refreshes are event-driven; do not re-render on an idle timer.\n', text, count=1)
          if count != 1:
              raise SystemExit('Expected 25-second dashboard refresh block was not found.')
          dashboard.write_text(new_text, encoding='utf-8')

          for name in ('index.html', 'register.html', 'dashboard.html'):
              page = root / 'frontend' / name
              txt = page.read_text(encoding='utf-8')
              tag = '<script src="js/ui-bug-fixes.js"></script>'
              if tag not in txt:
                  pos = txt.lower().rfind('</body>')
                  if pos < 0: raise SystemExit(f'Missing </body> in {name}')
                  txt = txt[:pos] + '    ' + tag + '\n' + txt[pos:]
                  page.write_text(txt, encoding='utf-8')
          print('UI patch applied successfully.')
          PY

      - name: Validate JavaScript
        run: |
          node --check frontend/js/ui-bug-fixes.js
          node --check frontend/js/dashboard.js

      - name: Commit and remove one-off workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/css/style.css frontend/css/ui-bug-fixes.css frontend/js/ui-bug-fixes.js frontend/js/dashboard.js frontend/index.html frontend/register.html frontend/dashboard.html
          git rm -f .github/workflows/apply-ui-bug-fixes.yml .github/workflows/apply-ui-bug-fixes-v2.yml 2>/dev/null || true
          git diff --cached --check
          git commit -m 'fix(ui): repair auth controls mobile layout and dashboard refresh'
          git push origin HEAD:main
