name: Architecture Test Hardening

on:
  push:
    branches:
      - architecture-test-hardening-20260906

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Run targeted service tests
        run: ./mvnw -B -ntp -Dtest=ExpenseServiceImplTest,CategoryServiceImplTest,UserServiceImplTest,PasswordResetServiceTest test
