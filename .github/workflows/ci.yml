name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Run Maven tests
        shell: bash
        run: |
          set -o pipefail
          mvn -B test 2>&1 | tee backend-test.log
      - name: Upload backend test log and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend-test.log
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Web frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find frontend/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check mobile TypeScript
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit

  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reject tracked local artifacts and production test hooks
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(\\.env|.*\\.keystore|.*\\.db|.*\\.mv\\.db)$'
          ! grep -R --line-number --exclude-dir=.git --exclude='package-lock.json' 'mock_jwt_token_123\\|test_mock_auth=true' frontend mobile src
