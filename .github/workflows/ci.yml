name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Run Maven tests
        shell: bash
        run: |
          set -o pipefail
          mvn -B test 2>&1 | tee backend-test.log
      - name: Upload backend test log and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: |
            backend-test.log
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Web frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find frontend/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check mobile TypeScript
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit

  e2e:
    name: Playwright UI and WebAuthn checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package.json
      - name: Install Playwright dependencies
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Serve frontend
        shell: bash
        run: |
          python3 -m http.server 5500 --directory frontend > /tmp/expense-tracker-frontend.log 2>&1 &
          echo $! > /tmp/expense-tracker-frontend.pid
      - name: Run focused mobile UI and WebAuthn E2E checks
        working-directory: e2e
        env:
          BASE_URL: http://localhost:5500
        run: |
          npx playwright test tests/mobile-ui-regressions.spec.ts tests/biometrics.spec.ts --project=chromium
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-regression-artifacts
          path: |
            e2e/playwright-report/**
            e2e/test-results/**
            /tmp/expense-tracker-frontend.log
          if-no-files-found: ignore
          retention-days: 7

  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Reject tracked local artifacts and production test hooks
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(\\.env|.*\\.keystore|.*\\.db|.*\\.mv\\.db)$'
          ! grep -R --line-number --exclude-dir=.git --exclude='package-lock.json' 'mock_jwt_token_123\\|test_mock_auth=true' frontend mobile src
