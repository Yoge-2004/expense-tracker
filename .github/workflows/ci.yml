name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Run Maven tests
        shell: bash
        run: |
          set -o pipefail
          mvn -B test 2>&1 | tee backend-test.log
      - name: Annotate Maven failures
        if: failure()
        shell: bash
        run: python3 .github/scripts/annotate_maven_failures.py backend-test.log
      - name: Upload backend test log and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: |
            backend-test.log
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 7

  mobile-restore:
    name: Mobile restore against real backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Build backend jar
        shell: bash
        run: mvn -B -q -DskipTests package
      - name: Start backend on a throwaway database
        shell: bash
        run: |
          JAR=$(ls target/*.jar | grep -v original | head -1)
          SPRING_DATASOURCE_URL="jdbc:h2:file:/tmp/restore_it_db;MODE=PostgreSQL" \
            nohup java -jar "$JAR" > backend-run.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --silent --fail http://localhost:8080/api/health >/dev/null; then echo "backend up"; exit 0; fi
            sleep 3
          done
          echo "::error::backend did not start"; tail -n 60 backend-run.log | cut -c1-300; exit 1
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Run restore integration test
        working-directory: mobile
        env:
          RESTORE_TEST_BACKEND_URL: http://localhost:8080
        shell: bash
        run: |
          set -o pipefail
          npx jest --ci __tests__/ledgerRestore.integration.test.ts 2>&1 | tee ../restore-it.log
      - name: Report restore test result
        if: always()
        shell: bash
        run: |
          echo "::notice title=restore-integration::$(grep -E 'Tests:|✓|✕' restore-it.log | tr '\n' ' ' | cut -c1-300)"
          echo "::notice title=restore-integration-error::$(grep -m1 -A14 '●' restore-it.log | grep -v '^\s*at ' | tr '\n' ' ' | cut -c1-1500)"
          echo "::notice title=restore-integration-users::$(grep -c 'POST /api/expenses' backend-run.log || true) expense posts seen by the backend"
      - name: Annotate failures
        if: failure()
        shell: bash
        run: |
          grep -E "●|Expected|Received|->|Error|failed" restore-it.log | head -12 | cut -c1-400 | while read -r l; do echo "::error::$l"; done
          tail -n 25 backend-run.log | cut -c1-300 | head -12 | while read -r l; do echo "::warning::backend: $l"; done

  frontend:
    name: Web frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # All web JavaScript, including extracted modules, must parse cleanly.
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find frontend/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      # Advisory: some of its checks read live data from Expo's servers, so upstream changes can fail it
      # with no change to this repo (it did, on an unchanged package.json). Its findings are still printed.
      - name: Expo Doctor diagnostics (advisory)
        working-directory: mobile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes expo-doctor 2>&1 | tee expo-doctor.log
      # Advisory, like Expo Doctor: "installed versions match what Expo's servers currently expect" changes
      # whenever Expo publishes a patch, with no change in this repo (it passed and failed on identical
      # package versions minutes apart). It still runs and reports; the deterministic gates below
      # (TypeScript, Jest) must always run, so it must not stop them.
      - name: Check Expo dependency alignment (advisory)
        working-directory: mobile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx expo install --check 2>&1 | tee expo-install-check.log
      - name: Check mobile TypeScript
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Run mobile Jest suite
        working-directory: mobile
        run: npm test -- --ci --coverage --maxWorkers=2

  e2e:
    name: Playwright UI and WebAuthn checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package.json
      - name: Install Playwright dependencies
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check E2E TypeScript
        working-directory: e2e
        run: npm run typecheck
      - name: Serve frontend
        shell: bash
        run: |
          python3 -m http.server 5500 --directory frontend > /tmp/expense-tracker-frontend.log 2>&1 &
          echo $! > /tmp/expense-tracker-frontend.pid
      - name: Run focused mobile UI and WebAuthn E2E checks
        working-directory: e2e
        env:
          BASE_URL: http://localhost:5500
        run: |
          npx playwright test tests/mobile-ui-regressions.spec.ts tests/biometrics.spec.ts --project=chromium
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-regression-artifacts
          path: |
            e2e/playwright-report/**
            e2e/test-results/**
            /tmp/expense-tracker-frontend.log
          if-no-files-found: ignore
          retention-days: 7

  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Reject tracked local artifacts and production test hooks
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(\.env|.*\.keystore|.*\.db|.*\.mv\.db)$'
          ! git ls-files | grep -E '(^|/)(node_modules|test-results|playwright-report)/'
          ! grep -R --line-number --exclude-dir=.git --exclude='package-lock.json' 'mock_jwt_token_123\|test_mock_auth=true' frontend mobile src
