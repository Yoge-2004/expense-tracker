name: Refactor dashboard effects once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-dashboard-effects-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract rendering effects module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import indent

          dashboard = Path('frontend/js/dashboard.js')
          module = Path('frontend/js/modules/dashboard-effects.js')
          html = Path('frontend/dashboard.html')

          source = dashboard.read_text(encoding='utf-8')

          def extract(text, signature):
              start = text.index(signature)
              brace = text.index('{', start)
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              i = brace
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''
                  if line_comment:
                      if ch == '\n': line_comment = False
                      i += 1; continue
                  if block_comment:
                      if ch == '*' and nxt == '/': block_comment = False; i += 2; continue
                      i += 1; continue
                  if quote:
                      if escaped: escaped = False
                      elif ch == '\\': escaped = True
                      elif ch == quote: quote = None
                      i += 1; continue
                  if ch == '/' and nxt == '/': line_comment = True; i += 2; continue
                  if ch == '/' and nxt == '*': block_comment = True; i += 2; continue
                  if ch in "'\"`": quote = ch; i += 1; continue
                  if ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          while end < len(text) and text[end] in ' \t': end += 1
                          if end < len(text) and text[end] == '\n': end += 1
                          return text[start:end].strip(), text[:start] + text[end:]
                  i += 1
              raise RuntimeError(f'Unbalanced function: {signature}')

          signatures = ['function animateNumber(', 'function animatePercent(', 'function celebrateSuccess(', 'function updateStats(']
          extracted = []
          for signature in signatures:
              block, source = extract(source, signature)
              extracted.append(block)

          source = source.replace('// --- 5. UI RENDERING HELPERS & NUMBER COUNT ANIMATION ---\n', '', 1)
          anchor = 'const elements = window.DashboardDom.elements;\n'
          binding = 'const { animateNumber, animatePercent, celebrateSuccess, updateStats } = window.DashboardEffects;\n'
          if binding not in source:
              if anchor not in source: raise RuntimeError('Dashboard DOM anchor missing')
              source = source.replace(anchor, anchor + binding, 1)

          effect_body = '\n\n'.join(indent(block, '    ') for block in extracted)
          effect_module = '''/* Dashboard rendering effects and lightweight view animations. */
          (function () {
              "use strict";
              const { formatCurrency } = window.DashboardUtils;
              const elements = window.DashboardDom.elements;

          ''' + effect_body + '''

              window.DashboardEffects = Object.freeze({ animateNumber, animatePercent, celebrateSuccess, updateStats });
              window.animateNumber = animateNumber;
              window.animatePercent = animatePercent;
              window.celebrateSuccess = celebrateSuccess;
              window.updateStats = updateStats;
          })();
          '''
          module.write_text(effect_module, encoding='utf-8')
          dashboard.write_text(source, encoding='utf-8')

          page = html.read_text(encoding='utf-8')
          marker = '    <script src="js/modules/dashboard-ui.js"></script>\n'
          tag = '    <script src="js/modules/dashboard-effects.js"></script>\n'
          if 'js/modules/dashboard-effects.js' not in page:
              if marker not in page: raise RuntimeError('Dashboard module marker missing')
              page = page.replace(marker, marker + tag, 1)
          page = page.replace('href="css/style.css"', 'href="css/style.css?v=20260911"', 1)
          page = page.replace('href="css/motion-extended.css"', 'href="css/motion-extended.css?v=20260911"', 1)
          html.write_text(page, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: find frontend/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Commit and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/js frontend/dashboard.html
          git rm .github/workflows/refactor-dashboard-effects-once.yml
          git add -u
          git diff --cached --check
          git commit -m 'refactor(js): extract dashboard rendering effects'
          git push origin HEAD:main

# Trigger marker v2.