name: One-shot dashboard chart refactor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !startsWith(github.event.head_commit.message, 'refactor(ui): extract dashboard chart controllers') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Extract chart controllers
        run: python3 scripts/extract-dashboard-charts.py

      - name: Validate extracted JavaScript
        run: |
          set -euo pipefail
          find frontend/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Verify dashboard chart module
        run: |
          set -euo pipefail
          test -s frontend/js/modules/dashboard-charts.js
          grep -q 'js/modules/dashboard-charts.js' frontend/dashboard.html
          grep -q 'renderPieChart' frontend/js/dashboard.js
          grep -q 'renderTrendChart' frontend/js/dashboard.js
          grep -q 'renderBudgetVsActualChart' frontend/js/dashboard.js

      - name: Commit refactor
        run: |
          if git diff --quiet -- frontend/js/dashboard.js frontend/js/modules/dashboard-charts.js frontend/dashboard.html; then
            echo "No refactor changes needed."
            exit 0
          fi
          git add frontend/js/dashboard.js frontend/js/modules/dashboard-charts.js frontend/dashboard.html
          git commit -m "refactor(ui): extract dashboard chart controllers"
          git push origin HEAD:main
