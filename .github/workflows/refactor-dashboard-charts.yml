name: One-shot dashboard chart refactor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Skip if already extracted
        id: guard
        run: |
          if test -s frontend/js/modules/dashboard-charts.js && grep -q 'js/modules/dashboard-charts.js' frontend/dashboard.html; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract chart controllers
        if: steps.guard.outputs.already != 'true'
        run: python3 scripts/extract-dashboard-charts.py

      - name: Validate extracted JavaScript
        if: steps.guard.outputs.already != 'true'
        run: |
          set -euo pipefail
          find frontend/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Verify dashboard chart module
        if: steps.guard.outputs.already != 'true'
        run: |
          set -euo pipefail
          test -s frontend/js/modules/dashboard-charts.js
          grep -q 'js/modules/dashboard-charts.js' frontend/dashboard.html
          grep -q 'renderPieChart' frontend/js/dashboard.js
          grep -q 'renderTrendChart' frontend/js/dashboard.js
          grep -q 'renderBudgetVsActualChart' frontend/js/dashboard.js

      - name: Commit refactor
        if: steps.guard.outputs.already != 'true'
        run: |
          if git diff --quiet -- frontend/js/dashboard.js frontend/js/modules/dashboard-charts.js frontend/dashboard.html; then
            echo "No chart extraction changes required."
            exit 0
          fi
          git add frontend/js/dashboard.js frontend/js/modules/dashboard-charts.js frontend/dashboard.html
          git commit -m "refactor(js): extract dashboard chart controllers"
          git push origin HEAD:main
