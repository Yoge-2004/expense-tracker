name: Deploy Backend + ML to Hugging Face

# Production deployment for the combined Hugging Face Docker Space.
# Spring Boot and Python inference run in the same container.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'ml/src/**'
      - 'ml/api/**'
      - 'ml/pyproject.toml'
      - 'ml/.python-version'
      - 'hf-space/README.md'
      - '.github/workflows/deploy-backend-hf.yml'

permissions:
  contents: read

env:
  HF_SPACE_REPO: Yoge-2004/expense-tracker-backend

jobs:
  build-and-deploy:
    name: Build Spring Boot JAR and deploy combined Space
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build production JAR
        run: mvn -B -DskipTests package

      - name: Prepare Hugging Face Space payload
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo 'No executable Spring Boot JAR was produced.'
            exit 1
          fi
          rm -rf hf-space-payload
          mkdir -p hf-space-payload
          cp "$JAR" hf-space-payload/app.jar
          cp Dockerfile hf-space-payload/Dockerfile
          cp .dockerignore hf-space-payload/.dockerignore
          cp -R docker hf-space-payload/docker
          cp -R ml hf-space-payload/ml
          cp hf-space/README.md hf-space-payload/README.md
          ls -lah hf-space-payload

      - name: Validate Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN:-}" ]; then
            echo 'HF_TOKEN GitHub Actions secret is missing.'
            echo 'Add a Hugging Face write token as repository secret HF_TOKEN before enabling deployment.'
            exit 1
          fi

      - name: Install Hugging Face Hub library
        run: python -m pip install --upgrade huggingface_hub

      - name: Free Space storage held by superseded builds
        # Squashing git history does not release Hugging Face LFS storage, so every deploy leaves the
        # previous app.jar behind until the 1 GB Space limit is hit. This deletes superseded LFS versions
        # of large files (old jars) that the current Space commit no longer uses. It never touches a file
        # version used by the current commit and leaves small files (database snapshots) alone.
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import collections, os, time
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ['HF_TOKEN'])
          repo = os.environ['HF_SPACE_REPO']
          MIN_PRUNE_BYTES = 5_000_000

          def note(kind, title, lines):
              text = '\n'.join(lines).replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::{kind} title={title}::{text}')

          files = list(api.list_lfs_files(repo_id=repo, repo_type='space'))
          total = sum(f.size for f in files)
          commits = len(list(api.list_repo_commits(repo_id=repo, repo_type='space')))

          # LFS hashes used by the current Space commit: these are never deleted.
          in_use = set()
          for entry in api.list_repo_tree(repo_id=repo, repo_type='space', recursive=True):
              lfs = getattr(entry, 'lfs', None)
              if lfs is not None:
                  in_use.add(lfs.sha256)

          groups = collections.defaultdict(list)
          for f in files:
              groups[f.filename].append(f)

          stale, lines = [], [f'before: {commits} commits, {len(files)} LFS objects, {total / 1e6:.1f} MB']
          for name, items in groups.items():
              if len(items) < 2:
                  continue
              live = [i for i in items if i.oid in in_use or i.file_oid in in_use]
              if not live:
                  lines.append(f'skipped {name}: could not identify the version used by the current commit')
                  continue
              old = [i for i in items if i not in live and i.size >= MIN_PRUNE_BYTES]
              if old:
                  stale.extend(old)
                  lines.append(f'{name}: keeping {len(live)} in use, deleting {len(old)} superseded ({sum(i.size for i in old) / 1e6:.1f} MB)')

          if stale:
              api.permanently_delete_lfs_files(repo_id=repo, lfs_files=stale, rewrite_history=True, repo_type='space')
              lines.append(f'freed {sum(i.size for i in stale) / 1e6:.1f} MB')
              time.sleep(20)
          else:
              lines.append('nothing to free')
          note('notice', 'Hugging Face Space storage cleanup', lines)
          PY

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, time
          from huggingface_hub import HfApi

          repo = os.environ['HF_SPACE_REPO']
          token = os.environ['HF_TOKEN']
          sha = os.environ.get('GITHUB_SHA', 'latest')[:7]
          api = HfApi(token=token)

          # Periodically squash Git history when commit count grows to stay well below 1 GB storage limit
          try:
              commits = list(api.list_repo_commits(repo_id=repo, repo_type='space'))
              if len(commits) > 20:
                  print(f'Space {repo} has {len(commits)} commits; compacting history to reclaim storage...')
                  api.super_squash_history(
                      repo_id=repo,
                      branch='main',
                      repo_type='space',
                      token=token,
                      commit_message='Compact Space history before deployment',
                  )
                  time.sleep(5)
                  print('History compacted.')
              else:
                  print(f'Space {repo} has {len(commits)} commits; compaction not required.')
          except Exception as exc:
              detail = f'{type(exc).__name__}: {exc}'[:900].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::warning title=Space history compaction skipped::{detail}')

          delete_patterns = ['expense_tracker.db', 'expenses_sync.json', '*.sqlite', '*.sqlite3', '*.db']

          for attempt in range(1, 4):
              try:
                  print(f'Uploading payload to {repo} (attempt {attempt}/3)...')
                  commit_info = api.upload_folder(
                      folder_path='hf-space-payload',
                      repo_id=repo,
                      repo_type='space',
                      commit_message=f'Deploy combined backend + ML {sha}',
                      delete_patterns=delete_patterns,
                  )
                  print(f'Deployment succeeded: {commit_info.commit_url}')
                  break
              except Exception as exc:
                  print(f'Attempt {attempt} failed: {exc}')
                  detail = f'{type(exc).__name__}: {exc}'[:900].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title=Hugging Face upload attempt {attempt} failed::{detail}')
                  if attempt == 3:
                      raise
                  time.sleep(5 * attempt)
          PY

      - name: Publish deployment summary
        run: |
          echo "### Hugging Face combined deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Space: \`$HF_SPACE_REPO\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Spring Boot: \`:8080\` internal" >> "$GITHUB_STEP_SUMMARY"
          echo "- Python ML: \`:8000\` internal" >> "$GITHUB_STEP_SUMMARY"
          echo "- Space gateway: \`:7860\`" >> "$GITHUB_STEP_SUMMARY"
