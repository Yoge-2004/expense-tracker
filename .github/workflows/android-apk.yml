name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
    branches: [main]

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Validate EAS token
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_TOKEN="${EXPO_TOKEN:-}"
          # Normalize accidental whitespace/newlines introduced while copying the token.
          CLEAN_TOKEN="${CLEAN_TOKEN//$'\r'/}"
          CLEAN_TOKEN="${CLEAN_TOKEN//$'\n'/}"
          CLEAN_TOKEN="${CLEAN_TOKEN//$'\t'/}"
          CLEAN_TOKEN="${CLEAN_TOKEN#\"}"
          CLEAN_TOKEN="${CLEAN_TOKEN%\"}"
          CLEAN_TOKEN="${CLEAN_TOKEN#\'}"
          CLEAN_TOKEN="${CLEAN_TOKEN%\'}"
          CLEAN_TOKEN="$(printf '%s' "$CLEAN_TOKEN" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [ -z "$CLEAN_TOKEN" ]; then
            echo "EXPO_TOKEN is missing or empty."
            exit 1
          fi
          if ! printf '%s' "$CLEAN_TOKEN" | LC_ALL=C grep -Eq '^[ -~]+$'; then
            echo "EXPO_TOKEN contains unsupported control/non-ASCII characters."
            exit 1
          fi
          printf 'EXPO_TOKEN=%s\n' "$CLEAN_TOKEN" >> "$GITHUB_ENV"
          echo "EAS token validated successfully (length=${#CLEAN_TOKEN})."

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --no-save eas-cli@latest

      - name: Verify Expo authentication
        run: |
          set -euo pipefail
          ./node_modules/.bin/eas whoami

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Expo Doctor diagnostics
        shell: bash
        run: |
          set -o pipefail
          npx expo-doctor 2>&1 | tee expo-doctor.log

      - name: Build APK with EAS
        run: ./node_modules/.bin/eas build --platform android --profile preview --non-interactive --wait

      - name: Download APK
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/eas build:list --platform android --limit 1 --json > eas-build.json
          node -e "const fs=require('fs'); const builds=JSON.parse(fs.readFileSync('eas-build.json','utf8')); const url=builds[0]?.artifacts?.buildUrl; if(!url) throw new Error('EAS did not return an APK build URL'); fs.writeFileSync('apk-url.txt', url);"
          curl --fail --location --retry 3 "$(cat apk-url.txt)" --output expense-tracker.apk
          test -s expense-tracker.apk

      - name: Verify APK package, signature and Google Sign-In fingerprint
        shell: bash
        run: |
          set -euo pipefail
          unzip -l expense-tracker.apk | grep -E 'AndroidManifest.xml|classes.dex' >/dev/null
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose expense-tracker.apk
          "$APKSIGNER" verify --print-certs expense-tracker.apk | tee android-signing-certificate.txt
          sha256sum expense-tracker.apk | tee expense-tracker.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-android-apk
          path: |
            mobile/expense-tracker.apk
            mobile/expense-tracker.apk.sha256
            mobile/android-signing-certificate.txt
          retention-days: 30

      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-build-logs
          path: |
            mobile/expo-doctor.log
            mobile/android-signing-certificate.txt
            mobile/eas-build.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Expense Tracker Android v${{ github.run_number }}
          body: |
            Standalone Android APK built from main at commit ${{ github.sha }}.
            EAS Build profile: preview (APK).
            Google Sign-In: the Android signing certificate fingerprint is included in the workflow artifacts for registering the EAS release SHA-1 in Google Cloud.
          files: |
            mobile/expense-tracker.apk
            mobile/expense-tracker.apk.sha256
          fail_on_unmatched_files: true
