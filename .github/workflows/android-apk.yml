name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Expo project validation
        run: npx expo-doctor

      - name: Generate Android project from Expo config
        run: npx expo prebuild --platform android --non-interactive

      - name: Build installable debug APK
        run: ./android/gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          cp "$APK_PATH" expense-tracker.apk
          test -s expense-tracker.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-android-apk
          path: mobile/expense-tracker.apk
          retention-days: 30

      - name: Publish APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Expense Tracker Android v${{ github.run_number }}
          body: |
            Installable Android APK built locally from the Expo project on main at commit ${{ github.sha }}.
            This build does not require Expo/EAS authentication.
          files: mobile/expense-tracker.apk
          fail_on_unmatched_files: true
