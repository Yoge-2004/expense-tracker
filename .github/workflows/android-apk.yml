name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Expo Doctor diagnostics
        shell: bash
        run: |
          set -o pipefail
          npx expo-doctor 2>&1 | tee expo-doctor.log

      - name: Generate Android project from Expo config
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Build standalone release APK
        shell: bash
        run: |
          set -o pipefail
          cd android
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee ../gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Verify APK contains embedded JavaScript bundle
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          if ! unzip -l "$APK_PATH" | grep -Eq 'assets/index\.android\.(bundle|js)$'; then
            echo "ERROR: Release APK does not contain an embedded Android JavaScript bundle."
            exit 1
          fi
          echo "Embedded JavaScript bundle verified. Metro is not required by this APK."

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK_PATH"

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          cp "$APK_PATH" expense-tracker.apk
          sha256sum expense-tracker.apk | tee expense-tracker.apk.sha256
          test -s expense-tracker.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-android-apk
          path: |
            mobile/expense-tracker.apk
            mobile/expense-tracker.apk.sha256
          retention-days: 30

      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-build-logs
          path: |
            mobile/expo-doctor.log
            mobile/gradle-build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Expense Tracker Android v${{ github.run_number }}
          body: |
            Standalone Android APK built from the Expo project on main at commit ${{ github.sha }}.
            The release variant embeds the JavaScript bundle; Metro is not required after installation.
          files: |
            mobile/expense-tracker.apk
            mobile/expense-tracker.apk.sha256
          fail_on_unmatched_files: true
