name: Format modular CSS

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-css:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format modular CSS
        run: npx --yes prettier@3.6.2 --write 'frontend/css/components/*.css' 'frontend/css/dashboard/*.css'

      - name: Commit formatting changes
        run: |
          if git diff --quiet -- frontend/css/components frontend/css/dashboard; then
            echo 'CSS is already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/css/components frontend/css/dashboard
          git commit -m 'style(css): format modular stylesheet files'
          git push
