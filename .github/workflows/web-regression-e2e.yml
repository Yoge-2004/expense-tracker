name: Web regression E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-regression:
    name: Mobile UI + WebAuthn browser tests
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund

      - name: Install Chromium browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Check E2E TypeScript
        working-directory: e2e
        run: npm run typecheck

      - name: Start static frontend server
        run: |
          python3 -m http.server 5500 --directory frontend > /tmp/expense-tracker-frontend.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --silent --fail http://localhost:5500/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/expense-tracker-frontend.log
          exit 1

      - name: Run WebAuthn browser regression
        working-directory: e2e
        env:
          CI: true
          BASE_URL: http://localhost:5500
        run: npx playwright test tests/biometrics.spec.ts --project=chromium

      - name: Run critical UI regressions
        working-directory: e2e
        env:
          CI: true
          BASE_URL: http://localhost:5500
        continue-on-error: true
        run: npx playwright test tests/critical-ui-regressions.spec.ts --project=chromium

      - name: TEMP - full untested suite (user reports site-wide breakage, verifying against everything)
        if: always()
        working-directory: e2e
        env:
          CI: true
          BASE_URL: http://localhost:5500
        run: npx playwright test tests/dashboard.spec.ts tests/ui-regressions.spec.ts tests/login.spec.ts tests/expenses.spec.ts tests/budgets.spec.ts tests/incomes.spec.ts --project=chromium --reporter=list 2>&1 | tee /tmp/full-suite.log || true

      - name: TEMP - summarize full suite failures
        if: always()
        run: |
          python3 - <<'PY'
          import re
          txt = open('/tmp/full-suite.log', errors='replace').read()
          m = re.findall(r'(\d+) (passed|failed|flaky|skipped)', txt)
          print('::notice title=Suite totals::' + ', '.join(f'{n} {k}' for n, k in m[-4:]))
          blocks = re.split(r'\n(?=\s+\d+\) \[)', txt)[1:]
          out = []
          for b in blocks:
              lines = [l.strip() for l in b.splitlines() if l.strip()]
              keep = [lines[0][:160]] + [l[:140] for l in lines[1:] if re.match(r'(Error:|Locator:|Expected|Received|Timeout:)', l)][:3]
              out.append(' | '.join(keep))
          body = '\n'.join(out)[:45000].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error title=Failing tests (' + str(len(out)) + ')::' + body)
          PY

      - name: Run mobile UI regressions on Pixel 7
        working-directory: e2e
        env:
          CI: true
          BASE_URL: http://localhost:5500
        run: npx playwright test tests/mobile-ui-regressions.spec.ts --project=mobile-chrome

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-regression-playwright-report
          path: e2e/playwright-report
          if-no-files-found: warn
          retention-days: 7
