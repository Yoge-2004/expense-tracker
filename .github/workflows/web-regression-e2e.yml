name: Web regression E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-regression:
    name: Mobile UI + WebAuthn browser tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start static frontend server
        run: |
          python3 -m http.server 5500 --directory frontend > /tmp/expense-tracker-frontend.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --silent --fail http://localhost:5500/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/expense-tracker-frontend.log
          exit 1

      - name: Run focused browser regressions
        working-directory: e2e
        env:
          CI: true
          BASE_URL: http://localhost:5500
        run: npx playwright test tests/mobile-ui-regressions.spec.ts tests/biometrics.spec.ts --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-regression-playwright-report
          path: e2e/playwright-report
          if-no-files-found: warn
          retention-days: 7
