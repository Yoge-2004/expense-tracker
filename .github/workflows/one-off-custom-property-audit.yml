name: One-off CSS token audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-custom-property-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit CSS tokens and file sizes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('frontend/css')
          files = sorted(root.rglob('*.css'))
          defined = set()
          used = {}
          for path in files:
              text = path.read_text(encoding='utf-8')
              for name in re.findall(r'(?m)^\s*(--[A-Za-z0-9_-]+)\s*:', text):
                  defined.add(name)
              for name in re.findall(r'var\(\s*(--[A-Za-z0-9_-]+)', text):
                  used.setdefault(name, []).append(str(path.relative_to(root)))

          undefined = sorted(name for name in used if name not in defined)
          unused = sorted(name for name in defined if name not in used)

          print('=== CSS FILE SIZES ===')
          for path in sorted(files, key=lambda p: p.stat().st_size, reverse=True):
              print(f'{path.stat().st_size:6d} {path.relative_to(root)}')

          print('=== UNDEFINED CUSTOM PROPERTIES ===')
          if undefined:
              for name in undefined:
                  print(name)
                  for path in sorted(set(used[name])):
                      print(f'  {path}')
          else:
              print('NONE')

          print('=== UNUSED ROOT CUSTOM PROPERTIES ===')
          for name in unused:
              print(name)

          print(f'UNDEFINED_COUNT={len(undefined)}')
          print(f'DEFINED_COUNT={len(defined)}')
          print(f'USED_COUNT={len(used)}')
          PY