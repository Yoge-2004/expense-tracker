name: One-off CSS token normalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-css-token-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Normalize CSS custom properties
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          motion = Path('frontend/css/motion-extended.css')
          text = motion.read_text(encoding='utf-8')
          replacements = {
              '.glow-follow {\n    position: relative;': '.glow-follow {\n    --glow-x: 50%;\n    --glow-y: 50%;\n    position: relative;',
              '.momentum-settle {\n    animation: momentumSettle': '.momentum-settle {\n    --momentum-from: 0px;\n    animation: momentumSettle',
              '.tilt-target {\n    transition: transform 0.35s var(--ease);': '.tilt-target {\n    --tilt-x: 0deg;\n    --tilt-y: 0deg;\n    transition: transform 0.35s var(--ease);',
              '[data-reveal] {\n    opacity: 0;': '[data-reveal] {\n    --reveal-delay: 0ms;\n    opacity: 0;',
              '.reveal-stagger-parent > * { --reveal-delay: calc(var(--stagger-index, 0) * 70ms); }': '.reveal-stagger-parent > * {\n    --stagger-index: 0;\n    --reveal-delay: calc(var(--stagger-index, 0) * 70ms);\n}',
              '.auth-hero-bg, .hero-grid, .hero-orb {\n    transform: translateY(calc(var(--parallax-y, 0px) * 1));': '.auth-hero-bg, .hero-grid, .hero-orb {\n    --parallax-y: 0px;\n    transform: translateY(calc(var(--parallax-y, 0px) * 1));',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing motion replacement marker: {old}')
              text = text.replace(old, new, 1)
          motion.write_text(text, encoding='utf-8')

          reports = Path('frontend/css/reports.css')
          text = reports.read_text(encoding='utf-8')
          count = text.count('var(--text)')
          if count:
              text = text.replace('var(--text)', 'var(--text-main)')
              reports.write_text(text, encoding='utf-8')

          modals = Path('frontend/css/modals.css')
          text = modals.read_text(encoding='utf-8')
          if 'var(--transition-fast)' in text:
              text = text.replace('var(--transition-fast)', 'var(--ease)')
              modals.write_text(text, encoding='utf-8')

          PY
      - name: Commit fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/css/motion-extended.css frontend/css/reports.css frontend/css/modals.css
          git commit -m 'refactor(css): normalize custom property tokens' || exit 0
          git push origin HEAD:main
