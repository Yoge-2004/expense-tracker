name: One-time dashboard UI stabilization

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  PATCH_REVISION: "3"

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Patch dashboard stability and income responsive UI
        shell: python
        run: |
          from pathlib import Path

          api = Path('frontend/js/api.js')
          s = api.read_text()
          old = '''    activeRequests += 1;
    setLoading(true, retriesLeft < 2 ? "Waking up server (cold start)..." : "Connecting to server...");
    let response;'''
          new = '''    // Background GETs must not flash the global loading veil. The dashboard
    // performs several parallel reads, and showing the global loader for every
    // one made the page appear to randomly refresh/flicker during normal use.
    // Mutations still show the loader, and callers can opt a GET in with
    // showLoading: true.
    const showRequestLoading = options.showLoading === true || method !== "GET";
    if (showRequestLoading) {
        activeRequests += 1;
        setLoading(true, retriesLeft < 2 ? "Waking up server (cold start)..." : "Connecting to server...");
    }
    let response;'''
          if old in s and 'const showRequestLoading = options.showLoading === true' not in s:
              s = s.replace(old, new, 1)
          old_finally = '''    } finally {
        activeRequests -= 1;
        if (activeRequests === 0) setLoading(false);
    }'''
          new_finally = '''    } finally {
        if (showRequestLoading) {
            activeRequests -= 1;
            if (activeRequests === 0) setLoading(false);
        }
    }'''
          if old_finally in s and 'if (showRequestLoading) {' not in s:
              s = s.replace(old_finally, new_finally, 1)
          api.write_text(s)

          css = Path('frontend/css/tables.css')
          c = css.read_text()
          marker = '/* Mobile income cards: prevent table-width overflow and keep actions visually consistent with the expense ledger. */'
          block = '''

/* Mobile income cards: prevent table-width overflow and keep actions visually consistent with the expense ledger. */
.income-table-container {
    width: 100% !important;
    max-width: 100% !important;
    overflow-x: hidden !important;
    box-sizing: border-box !important;
}
.income-table { width: 100% !important; max-width: 100% !important; }
.income-table .btn-edit,
.income-table .btn-delete {
    width: 36px !important; height: 36px !important;
    min-width: 36px !important; min-height: 36px !important;
    padding: 0 !important; border-radius: 12px !important;
    display: inline-flex !important; align-items: center !important;
    justify-content: center !important; flex: 0 0 36px !important;
}
.income-table .btn-edit svg,
.income-table .btn-delete svg { width: 15px !important; height: 15px !important; flex-shrink: 0 !important; }

@media (max-width: 700px) {
    .income-table-container { overflow-x: hidden !important; padding: 0 !important; }
    .income-table, .income-table thead, .income-table tbody,
    .income-table tr, .income-table td {
        display: block !important; width: 100% !important; max-width: 100% !important;
        box-sizing: border-box !important;
    }
    .income-table thead { display: none !important; }
    .income-table tbody { display: grid !important; gap: 10px !important; }
    .income-table tbody tr {
        display: grid !important; grid-template-columns: minmax(0, 1fr) auto !important;
        gap: 0 12px !important; padding: 13px 12px !important;
        border: 1px solid var(--border) !important; border-radius: 14px !important;
        background: var(--card-bg) !important; box-shadow: 0 4px 18px rgba(0,0,0,0.08) !important;
        overflow: hidden !important;
    }
    .income-table tbody td {
        min-width: 0 !important; width: auto !important; max-width: none !important;
        padding: 4px 0 !important; border: 0 !important; white-space: normal !important;
        overflow-wrap: anywhere !important; word-break: break-word !important; vertical-align: middle !important;
    }
    .income-table tbody td:nth-child(1) {
        grid-column: 1 / -1 !important; color: var(--text-muted) !important;
        font-size: 11px !important; padding-bottom: 7px !important;
    }
    .income-table tbody td:nth-child(2) {
        grid-column: 1 !important; font-size: 14px !important; font-weight: 750 !important;
        color: var(--text-main) !important;
    }
    .income-table tbody td:nth-child(3) {
        grid-column: 1 / -1 !important; color: var(--text-muted) !important;
        font-size: 12px !important; line-height: 1.4 !important;
    }
    .income-table tbody td:nth-child(4) {
        grid-column: 1 !important; color: #10B981 !important; font-size: 11px !important;
        font-weight: 700 !important; text-transform: uppercase !important; letter-spacing: 0.04em !important;
    }
    .income-table tbody td:nth-child(5) {
        grid-column: 1 !important; grid-row: 3 !important; color: #10B981 !important;
        font-family: var(--font-mono) !important; font-size: 15px !important; font-weight: 800 !important;
        white-space: nowrap !important;
    }
    .income-table tbody td:nth-child(6) {
        grid-column: 2 !important; grid-row: 2 / span 2 !important; align-self: center !important;
        justify-self: end !important; display: flex !important; align-items: center !important;
        justify-content: flex-end !important; gap: 7px !important; padding: 0 !important;
    }
    .income-table tbody td:nth-child(6) .btn-edit,
    .income-table tbody td:nth-child(6) .btn-delete {
        width: 34px !important; height: 34px !important; min-width: 34px !important;
        min-height: 34px !important; border-radius: 10px !important;
    }
    .income-table tbody td:nth-child(6) .btn-edit svg,
    .income-table tbody td:nth-child(6) .btn-delete svg { width: 14px !important; height: 14px !important; }
}
'''
          if marker not in c:
              css.write_text(c + block)

      - name: Verify patched files
        shell: bash
        run: |
          set -euo pipefail
          node --check frontend/js/api.js
          node --check frontend/js/dashboard.js
          grep -q "showRequestLoading" frontend/js/api.js
          grep -q "Mobile income cards" frontend/css/tables.css

      - name: Commit stabilization patch and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/js/api.js frontend/css/tables.css
          git commit -m "fix(web): stabilize dashboard loading and responsive income ledger"
          git rm .github/workflows/ui-stability-patch.yml
          git commit -m "chore: remove one-time UI stabilization workflow"
          git push
