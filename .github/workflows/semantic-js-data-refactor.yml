name: Dashboard data controller extraction

on:
  push:
    branches: [refactor/js-dashboard-data]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Extract dashboard data controller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          dashboard = Path('frontend/js/dashboard.js')
          html = Path('frontend/dashboard.html')
          workflow = Path('.github/workflows/semantic-js-data-refactor.yml')

          src = dashboard.read_text(encoding='utf-8')
          start_marker = 'function renderDashboardData(expenses, categories) {'
          end_marker = '// --- PRO METRICS CALCULATION ---'
          start = src.find(start_marker)
          end = src.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Dashboard data controller block not found')

          replacement = '''const dashboardDataController = window.DashboardData.createController({
              getState: () => ({
                  allExpenses,
                  allCategories,
                  allIncomes,
                  allSavingsGoals,
                  userOnlyCategories
              }),
              setState: (next) => {
                  if (Object.prototype.hasOwnProperty.call(next, "allExpenses")) allExpenses = next.allExpenses;
                  if (Object.prototype.hasOwnProperty.call(next, "allCategories")) allCategories = next.allCategories;
                  if (Object.prototype.hasOwnProperty.call(next, "allIncomes")) allIncomes = next.allIncomes;
                  if (Object.prototype.hasOwnProperty.call(next, "allSavingsGoals")) allSavingsGoals = next.allSavingsGoals;
                  if (Object.prototype.hasOwnProperty.call(next, "userOnlyCategories")) userOnlyCategories = next.userOnlyCategories;
              },
              getUserId: () => userId,
              apiRequest,
              getCacheKey: window.getCacheKey,
              loadExpenseCache: window.loadExpenseCache,
              saveExpenseCache: window.saveExpenseCache,
              showSkeletonLoading: window.DashboardDom.showSkeletonLoading,
              renderCategoryData: (categories, expenses) => {
                  populateCategoryDropdown(categories);
                  populateFilterDropdowns(categories, expenses);
                  renderCategoryPills(categories);
                  applyFilters();
                  renderTrendChart(expenses);
              },
              renderIncomes,
              renderSavingsGoals,
              updateCashFlowMetrics,
              renderFinancialData: (expenses) => {
                  loadBudgets();
                  updateProMetrics(expenses);
              },
              showToast,
              clearApiCache: window.clearApiCache
          });

          const renderDashboardData = dashboardDataController.renderDashboardData;
          const loadDashboard = dashboardDataController.loadDashboard;
          window.renderDashboardData = renderDashboardData;
          window.loadDashboard = loadDashboard;

          '''

          src = src[:start] + replacement + src[end:]
          dashboard.write_text(src, encoding='utf-8')

          page = html.read_text(encoding='utf-8')
          tag = '<script src="js/modules/dashboard-data.js"></script>'
          if tag not in page:
              anchor = '<script src="js/dashboard.js"></script>'
              if anchor not in page:
                  raise SystemExit('dashboard.js script tag not found')
              page = page.replace(anchor, tag + '\n    ' + anchor, 1)
              html.write_text(page, encoding='utf-8')
          PY
      - name: Validate all frontend JavaScript
        run: |
          set -euo pipefail
          find frontend/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit extraction and remove temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/semantic-js-data-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/js/dashboard.js frontend/js/modules/dashboard-data.js frontend/dashboard.html
          git commit -m "refactor(js): extract dashboard data controller"
          git push origin HEAD:refactor/js-dashboard-data
