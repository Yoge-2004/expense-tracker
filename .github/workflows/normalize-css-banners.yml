name: Normalize CSS banner comments

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize banner indentation
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('frontend/css/components/actions.css'),
              Path('frontend/css/components/datepicker.css'),
              Path('frontend/css/dashboard/core.css'),
          ]
          for path in files:
              lines = path.read_text(encoding='utf-8').splitlines()
              if len(lines) >= 3:
                  lines[1] = lines[1].replace('      ', '   ', 1)
                  lines[2] = lines[2].replace('      ', '   ', 1)
                  path.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')
          PY

      - name: Commit banner cleanup
        run: |
          if git diff --quiet -- frontend/css/components/actions.css frontend/css/components/datepicker.css frontend/css/dashboard/core.css; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/css/components/actions.css frontend/css/components/datepicker.css frontend/css/dashboard/core.css
          git commit -m 'style(css): normalize modular CSS banner spacing'
          git push
