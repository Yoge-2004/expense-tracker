name: One-off auth support split

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-auth-support-split.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Split support spillover
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_file = Path('frontend/css/auth/dashboard-support.css')
          source = source_file.read_text(encoding='utf-8')
          marker = '/* ==========================================================================\n   LIVELY MOTION SUITE & MICRO-TRANSFORMATIONS\n   ========================================================================== */'
          if marker not in source:
              raise SystemExit('missing motion spillover marker')

          split_at = source.index(marker)
          dashboard = source[:split_at].rstrip() + '\n'
          motion = source[split_at:].strip() + '\n'

          support_dir = Path('frontend/css/auth/dashboard')
          support_dir.mkdir(parents=True, exist_ok=True)
          (support_dir / 'layout.css').write_text(dashboard, encoding='utf-8')
          (support_dir / 'motion.css').write_text(motion, encoding='utf-8')
          source_file.write_text('''/* ==========================================================================\n   AUTH DASHBOARD SUPPORT\n   Focused compatibility styles for shared dashboard elements on auth views.\n   ========================================================================== */\n\n@import url("dashboard/layout.css");\n@import url("dashboard/motion.css");\n''', encoding='utf-8')
          PY
      - name: Commit generated modules
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/css/auth/dashboard-support.css frontend/css/auth/dashboard/
          git commit -m 'refactor(css): split auth dashboard support and motion spillover' || exit 0
          git push origin HEAD:main
