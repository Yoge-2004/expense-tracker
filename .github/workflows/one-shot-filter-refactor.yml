name: One-shot dashboard filter refactor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Extract filter controller
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dashboard = Path('frontend/js/dashboard.js')
          html = Path('frontend/dashboard.html')
          workflow = Path('.github/workflows/one-shot-filter-refactor.yml')

          src = dashboard.read_text(encoding='utf-8')
          start_marker = '// --- 4. FILTERING (With Validation & Quick Presets) ---'
          end_marker = '// --- 5. UI RENDERING HELPERS & NUMBER COUNT ANIMATION ---'
          start = src.find(start_marker)
          end = src.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Dashboard filter block not found')

          replacement = '''// --- 4. FILTERING ---
          const dashboardFilterController = window.DashboardFilters.createController({
              elements,
              getExpenses: () => allExpenses,
              parseLocalDate,
              getLocalDateString,
              debounce,
              showToast,
              updateStats,
              renderPieChart,
              renderList,
              renderTrendChart,
              renderRecurringSplitChart,
              renderDayOfWeekChart,
              renderFinancialInsights,
              syncCategoryPillSelection,
              applyIncomeFilters: () => typeof applyIncomeFilters === "function" && applyIncomeFilters()
          });

          const applyFilters = dashboardFilterController.applyFilters;
          window.applyFilters = applyFilters;
          dashboardFilterController.wireControls();

          '''
          src = src[:start] + replacement + src[end:]

          duplicate = '''window.renderFinancialInsights = renderFinancialInsights;\n\n\n\nwindow.renderFinancialInsights = renderFinancialInsights;'''
          src = src.replace(duplicate, 'window.renderFinancialInsights = renderFinancialInsights;', 1)

          dashboard.write_text(src, encoding='utf-8')

          page = html.read_text(encoding='utf-8')
          tag = '<script src="js/modules/dashboard-filters.js"></script>'
          if tag not in page:
              anchor = '<script src="js/modules/dashboard-budget.js"></script>'
              if anchor not in page:
                  raise SystemExit('dashboard-budget.js script tag not found')
              page = page.replace(anchor, anchor + '\n    ' + tag, 1)
              html.write_text(page, encoding='utf-8')
          PY
      - name: Validate frontend JavaScript
        run: |
          set -euo pipefail
          find frontend/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit extraction and remove workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-filter-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/js/dashboard.js frontend/js/modules/dashboard-filters.js frontend/dashboard.html
          git commit -m "refactor(js): extract dashboard filter controller"
          git push origin HEAD:main
