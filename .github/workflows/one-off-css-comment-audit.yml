name: One-off CSS comment audit

on:
  push:
    paths:
      - 'frontend/css/**'
      - '.github/workflows/one-off-css-comment-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit CSS comments
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('frontend/css')
          findings = []
          for path in sorted(root.rglob('*.css')):
              text = path.read_text(encoding='utf-8')
              for index, match in enumerate(re.finditer(r'/\*(.*?)\*/', text, flags=re.S), 1):
                  body = re.sub(r'\s+', ' ', match.group(1)).strip()
                  if len(body) >= 180 or re.search(r'\b(consolidated from|earlier cleanup|this cleanup|phase [0-9]|dead code|was lines|same bug|winning|dropped it|restored)\b', body, flags=re.I):
                      findings.append((str(path), index, len(body), body))

          print(f'LONG_OR_HISTORICAL_COMMENTS={len(findings)}')
          for path, index, length, body in findings:
              print(f'FILE={path} COMMENT={index} LENGTH={length}')
              print(f'TEXT={body}')
              print('---')

          if findings:
              raise SystemExit(1)
