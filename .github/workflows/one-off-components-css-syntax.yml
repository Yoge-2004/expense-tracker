name: One-off components CSS syntax repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[css-syntax-repair]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair incomplete calendar rule
        shell: python
        run: |
          from pathlib import Path

          p = Path('frontend/css/components.css')
          s = p.read_text(encoding='utf-8')
          needle = '    width: min(340px, calc(100vw - 24px)) !important;\n'
          replacement = needle + '}\n'
          if not s.endswith(needle):
              raise SystemExit('Expected components.css to end at the incomplete cal-mobile-modal declaration; refusing to modify.')
          p.write_text(s + '}' + '\n', encoding='utf-8')
      - name: Validate CSS structure
        shell: python
        run: |
          from pathlib import Path
          s = Path('frontend/css/components.css').read_text(encoding='utf-8')
          if s.count('{') != s.count('}'):
              raise SystemExit(f'Unbalanced braces after repair: {s.count("{")} opens, {s.count("}")} closes')
          if not s.rstrip().endswith('}')):
              raise SystemExit('components.css still does not end with a closing brace')
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/css/components.css
          git diff --cached --check
          git commit -m 'fix: close components calendar rule [css-syntax-repair]'
          git push
