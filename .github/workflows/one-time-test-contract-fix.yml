name: One-time test contract fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'Yoge-2004'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update stale test contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          auth_test = Path('src/test/java/com/example/expensetracker/controller/AuthControllerTest.java')
          text = auth_test.read_text()
          old = '.andExpect(jsonPath("$.message").value("Verification code sent to new@example.com"));'
          new = '.andExpect(jsonPath("$.message").value("If this email is eligible, a verification code has been dispatched."));'
          if old not in text:
              raise SystemExit('Expected AuthControllerTest assertion was not found')
          auth_test.write_text(text.replace(old, new, 1))

          feature = Path('src/test/resources/features/auth.feature')
          text = feature.read_text()
          old = '''  Scenario: Email uniqueness is case-sensitive, not case-insensitive\n    Documents actual current behavior: UserRepository's email lookup is\n    case-sensitive (see its Javadoc), so "Case@Example.com" and\n    "case@example.com" are treated as two different accounts rather than\n    a duplicate. This may or may not be the intended product behavior, but\n    the test should reflect what the system actually does today.\n\n    Given a user is registered with email "case@example.com" and password "pass123"\n    When I register with name "Different Case", email "Case@Example.com", and password "pass123"\n    Then the response status code should be 201\n'''
          new = '''  Scenario: Email uniqueness is case-insensitive\n    Email identity is normalized for registration, so capitalization changes\n    must not create a second account for the same email address.\n\n    Given a user is registered with email "case@example.com" and password "pass123"\n    When I register with name "Different Case", email "Case@Example.com", and password "pass123"\n    Then the response status code should be 400\n'''
          if old not in text:
              raise SystemExit('Expected case-sensitivity scenario was not found')
          feature.write_text(text.replace(old, new, 1))

          selenium = Path('src/test/java/com/example/expensetracker/selenium/ExpenseTrackerSeleniumTest.java')
          text = selenium.read_text()
          old = '''        clickElement(themeBtn);\n        String toggledTheme = driver.findElement(By.tagName("html")).getAttribute("data-theme");\n        assertNotEquals(initialTheme, toggledTheme, "Theme data attribute should toggle on click");\n'''
          new = '''        clickElement(themeBtn);\n        wait.until(d -> !initialTheme.equals(d.findElement(By.tagName("html")).getAttribute("data-theme")));\n        String toggledTheme = driver.findElement(By.tagName("html")).getAttribute("data-theme");\n        assertNotEquals(initialTheme, toggledTheme, "Theme data attribute should toggle on click");\n'''
          if old not in text:
              raise SystemExit('Expected Selenium theme assertion was not found')
          text = text.replace(old, new, 1)
          old = '''        String savedTheme = (String) ((JavascriptExecutor) driver).executeScript("return localStorage.getItem('theme');");\n        assertNotNull(savedTheme, "Theme setting should be persisted in localStorage");\n'''
          new = '''        String savedTheme = (String) ((JavascriptExecutor) driver).executeScript("return localStorage.getItem('theme');");\n        wait.until(d -> ((JavascriptExecutor) d).executeScript("return localStorage.getItem('theme');") != null);\n        savedTheme = (String) ((JavascriptExecutor) driver).executeScript("return localStorage.getItem('theme');");\n        assertNotNull(savedTheme, "Theme setting should be persisted in localStorage");\n'''
          if old not in text:
              raise SystemExit('Expected Selenium persistence assertion was not found')
          text = text.replace(old, new, 1)
          selenium.write_text(text)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/test/java/com/example/expensetracker/controller/AuthControllerTest.java \
                  src/test/resources/features/auth.feature \
                  src/test/java/com/example/expensetracker/selenium/ExpenseTrackerSeleniumTest.java \
                  .github/workflows/one-time-test-contract-fix.yml
          git rm .github/workflows/one-time-test-contract-fix.yml
          git commit -m 'Align stale authentication and UI tests with current behavior'
          git push origin main
