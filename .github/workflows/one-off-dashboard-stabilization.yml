name: One-off dashboard stabilization

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply dashboard fixes and JS utility extraction
        shell: python
        run: |
          from pathlib import Path
          import re

          dash = Path("frontend/js/dashboard.js")
          html = Path("frontend/dashboard.html")
          css = Path("frontend/css/ui-regression-fixes.css")
          scripts = Path("frontend/js/modules")
          scripts.mkdir(parents=True, exist_ok=True)

          s = dash.read_text(encoding="utf-8")

          # Fix the production budget renderer crash caused by stale variable names.
          broken = '                    <div class="budget-status-row">\n                        <span>${formatCurrency(spent)} of ${formatCurrency(limit)}</span>'
          fixed = '                    <div class="budget-status-row">\n                        <span>${formatCurrency(b.spent)} of ${formatCurrency(b.limit)}</span>'
          if broken in s:
              s = s.replace(broken, fixed, 1)
          elif 'formatCurrency(spent)} of ${formatCurrency(limit)' in s:
              s = s.replace('formatCurrency(spent)} of ${formatCurrency(limit)', 'formatCurrency(b.spent)} of ${formatCurrency(b.limit)', 1)
          else:
              raise SystemExit("budget status renderer not found")

          # Replace the one remaining browser-native category confirmation.
          native_confirm = '            if (!confirm(`Delete category "${catName}"? This can\\'t be undone.`)) return;'
          app_confirm = '            if (!(await window.appConfirm(`Delete category "${catName}"? This can\\'t be undone.`))) return;'
          if native_confirm in s:
              s = s.replace(native_confirm, app_confirm, 1)

          # Extract shared formatting/date helpers into a standalone utility module.
          start = s.find('// Timezone-safe local date helpers')
          end = s.find('// Modal Scroll Lock Helpers')
          if start == -1 or end == -1 or end <= start:
              raise SystemExit("dashboard helper block boundaries not found")

          utility_block = '''// Shared dashboard utilities are maintained in js/modules/dashboard-utils.js.
const {
    getLocalDateString,
    parseLocalDate,
    escapeHtml,
    formatCurrency,
    formatDate,
} = window.DashboardUtils;
'''
          s = s[:start] + utility_block + '\n' + s[end:]
          dash.write_text(s, encoding="utf-8")

          utils = '''/* Shared, dependency-light dashboard utilities. */
(function () {
    "use strict";

    function getLocalDateString(date = new Date()) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
    }

    function parseLocalDate(value) {
        if (!value) return new Date();
        if (value instanceof Date) return value;
        const parts = String(value).split("T")[0].split("-");
        if (parts.length === 3) {
            return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        }
        return new Date(value);
    }

    function escapeHtml(value) {
        if (value == null) return "";
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatCurrency(amount) {
        if (typeof window.formatGlobalCurrency === "function") {
            return window.formatGlobalCurrency(amount);
        }
        const symbol = typeof window.getCurrencySymbol === "function" ? window.getCurrencySymbol() : "$";
        return `${symbol} ${Number(amount || 0).toFixed(2)}`;
    }

    function formatDate(value) {
        if (!value) return "";
        return parseLocalDate(value).toLocaleDateString(undefined, {
            year: "numeric",
            month: "short",
            day: "numeric",
        });
    }

    window.DashboardUtils = Object.freeze({
        getLocalDateString,
        parseLocalDate,
        escapeHtml,
        formatCurrency,
        formatDate,
    });
    window.escapeHtml = escapeHtml;
})();
'''
          (scripts / "dashboard-utils.js").write_text(utils, encoding="utf-8")

          # Ensure the utility runs before dashboard.js while keeping the existing classic-script architecture.
          h = html.read_text(encoding="utf-8")
          if 'js/modules/dashboard-utils.js' not in h:
              marker = re.search(r'(<script[^>]+src=["\']js/dashboard\.js(?:\?[^"\']*)?["\'][^>]*></script>)', h)
              if not marker:
                  raise SystemExit("dashboard.js script tag not found")
              util_tag = '    <script src="js/modules/dashboard-utils.js?v=20260910"></script>\n'
              h = h[:marker.start()] + util_tag + h[marker.start():]

          # Replace the unsupported/renderer-dependent biometrics glyph with a stable SVG icon.
          bio_old = '<a href="#" id="biometricAuthBtn">🧬 Biometrics (Touch/Face ID)</a>'
          bio_new = '''<a href="#" id="biometricAuthBtn" class="profile-menu-action">
                            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M7 3H5a2 2 0 0 0-2 2v2M17 3h2a2 2 0 0 1 2 2v2M3 17v2a2 2 0 0 0 2 2h2M21 17v2a2 2 0 0 1-2 2h-2"/>
                                <path d="M8 8c1.2-1.7 2.9-2.5 4-2.5S14.8 6.3 16 8M7.5 12c0-1.7 1.6-3.5 4.5-3.5s4.5 1.8 4.5 3.5c0 2.1-1.7 4-4.5 4s-4.5-1.9-4.5-4Z"/>
                            </svg>
                            <span>Biometrics (Touch/Face ID)</span>
                        </a>'''
          if bio_old in h:
              h = h.replace(bio_old, bio_new, 1)
          html.write_text(h, encoding="utf-8")

          # Desktop-only shortcut badge. The keydown handler remains active, so a mobile browser
          # that forwards Ctrl+K from an external keyboard can still use the shortcut without
          # reserving visual space for a desktop affordance.
          c = css.read_text(encoding="utf-8")
          mobile_rule = '@media (max-width:760px) { .command-kbd { display:none !important; } .top-bar-actions .command-search-wrapper { width:100% !important; min-width:0 !important; } }'
          old_mobile = '@media (max-width:760px) { .top-bar-actions .command-search-wrapper { width:100% !important; min-width:0 !important; } }'
          if mobile_rule not in c and old_mobile in c:
              c = c.replace(old_mobile, mobile_rule, 1)
          elif mobile_rule not in c:
              c += '\n' + mobile_rule + '\n'

          # Keep metric cards visually static while the theme is being swapped.
          c += '''

/* Theme changes must not replay card reveal/hover transforms. */
html.theme-transitioning .grid-4-metrics > .metric-card,
html.theme-transitioning .grid-4-metrics > .metric-card * {
    animation:none !important;
    transition:none !important;
}
'''
          css.write_text(c, encoding="utf-8")

      - name: Remove one-off workflow and commit changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-off-dashboard-stabilization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git add frontend/js/dashboard.js frontend/js/modules/dashboard-utils.js frontend/dashboard.html frontend/css/ui-regression-fixes.css
          git add -u .github/workflows/one-off-dashboard-stabilization.yml
          git commit -m "Fix dashboard budget crash and stabilize UI utilities"
          git push
