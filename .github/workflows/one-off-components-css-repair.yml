name: One-off components CSS repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[css-repair]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix undefined component theme tokens
        shell: python
        run: |
          from pathlib import Path

          p = Path('frontend/css/components.css')
          s = p.read_text(encoding='utf-8')

          replacements = {
              'background: var(--bg-card) !important;': 'background: var(--card-bg) !important;',
              'color: var(--text-heading) !important;': 'color: var(--text-main) !important;',
          }

          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}; refusing to modify.')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Verify repaired block
        shell: python
        run: |
          from pathlib import Path
          s = Path('frontend/css/components.css').read_text(encoding='utf-8')
          assert 'var(--bg-card)' not in s
          assert 'var(--text-heading)' not in s

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/css/components.css
          git diff --cached --check
          git commit -m 'fix: normalize component theme tokens [css-repair]'
          git push
