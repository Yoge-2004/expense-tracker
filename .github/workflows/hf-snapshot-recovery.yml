name: HF snapshot recovery (manual)

# TEMPORARY content on a throwaway branch (never merged): reads the Space run log with the repository secret
# HF_RECOVERY_TOKEN and prints a REDACTED summary as annotations.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        required: true
        options: [logs]
      oid:
        description: unused
        required: false
        default: ''
      target_repo:
        description: unused
        required: false
        default: ''
      target_repo_type:
        description: unused
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: hf-snapshot-recovery
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Download run log (not printed)
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_RECOVERY_TOKEN }}
        run: |
          curl -sS -N --max-time 780 \
            -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/spaces/Yoge-2004/expense-tracker-backend/logs/run" > raw.sse 2> curl.err || true
          echo "bytes: $(wc -c < raw.sse)"; head -c 300 curl.err | sed 's/Bearer [^ ]*/Bearer [x]/'
      - name: Summarise (redacted)
        shell: bash
        run: python3 scripts/tmp_hf_log_summary.py raw.sse
