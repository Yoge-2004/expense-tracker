name: Backup Neon Database to Encrypted GitHub Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://yoge-2004-expense-tracker-backend.hf.space
    steps:
      - name: Wake backend
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 90 "$BACKEND_URL/") || code="000"
            if [ "$code" != "000" ]; then
              echo "Backend responded with HTTP $code."
              exit 0
            fi
            echo "Backend not reachable (attempt $attempt/5); waiting 20 seconds..."
            sleep 20
          done
          echo "Backend did not become reachable. Neon snapshot was not modified."
          exit 1

      - name: Push current Neon/failover database snapshot
        env:
          SYNC_SECRET_KEY: ${{ secrets.SYNC_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$SYNC_SECRET_KEY" || { echo "Missing GitHub Actions secret SYNC_SECRET_KEY"; exit 1; }
          response=$(curl --fail --silent --show-error --max-time 180 \
            -X POST "$BACKEND_URL/api/sync/github-db" \
            -H "X-Sync-Token: $SYNC_SECRET_KEY" \
            -H "Accept: application/json")
          echo "$response"
          echo "$response" | grep -q '"status":"success"' || {
            echo "Database snapshot was not committed."
            exit 1
          }
          echo "Encrypted database snapshot updated in GitHub."
