name: One-time hardening remediation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message == 'Run one-time hardening remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply hardening edits
        shell: python
        run: |
          from pathlib import Path

          # Prevent DOM injection in password recovery status text.
          path = Path('frontend/forgot-password.html')
          text = path.read_text(encoding='utf-8')
          old = '                    codeSentNote.innerHTML = `Sent to <strong style="color: var(--primary);">${resetEmail}</strong>`;'
          new = '''                    codeSentNote.textContent = "Sent to ";
                    const recipient = document.createElement("strong");
                    recipient.style.color = "var(--primary)";
                    recipient.textContent = resetEmail;
                    codeSentNote.appendChild(recipient);'''
          if old not in text:
              raise SystemExit('forgot-password DOM interpolation not found; refusing partial remediation')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Enforce the same Bean Validation constraints on expense updates as on creation.
          path = Path('src/main/java/com/example/expensetracker/controller/ExpenseController.java')
          text = path.read_text(encoding='utf-8')
          old = '            @org.springframework.web.bind.annotation.RequestBody ExpenseDto expenseDto) {'
          new = '            @Valid @org.springframework.web.bind.annotation.RequestBody ExpenseDto expenseDto) {'
          if text.count(old) != 1:
              raise SystemExit(f'ExpenseController update signature match count was {text.count(old)}; refusing partial remediation')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Avoid returning parser internals and raw parameter values to unauthenticated clients.
          path = Path('src/main/java/com/example/expensetracker/exception/GlobalExceptionHandler.java')
          text = path.read_text(encoding='utf-8')
          old = '                "Malformed JSON request body: " + (ex.getMostSpecificCause() != null ? ex.getMostSpecificCause().getMessage() : ex.getMessage()),'
          new = '                "Malformed JSON request body.",'
          if old not in text:
              raise SystemExit('malformed JSON error detail not found; refusing partial remediation')
          text = text.replace(old, new, 1)
          old = '                "Invalid parameter value for \"" + ex.getName() + "\": " + ex.getValue(),'
          # Current source uses single quotes around parameter name; replace the exact generated line below.
          if old not in text:
              old = '                "Invalid parameter value for \'" + ex.getName() + "\': " + ex.getValue(),'
          new = '                "Invalid parameter value.",'
          if old not in text:
              raise SystemExit('type mismatch error detail not found; refusing partial remediation')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Validate hardening edits
        run: |
          git diff --check
          node --check frontend/js/dashboard.js
          node --check frontend/js/api.js
          ! grep -R --line-number --exclude-dir=.git 'mock_jwt_token_123\|test_mock_auth=true' frontend/js
          ! grep -R --line-number --exclude-dir=.git 'codeSentNote\.innerHTML' frontend/forgot-password.html

      - name: Commit remediation and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-hardening.yml
          git add frontend src/main/java
          if git diff --cached --quiet; then
            echo 'No hardening changes detected.'
            exit 1
          fi
          git commit -m 'Harden validation and client error handling'
          git push origin main
