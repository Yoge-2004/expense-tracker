name: Apply Targeted UI Fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-ui-regression-fixes.py'
      - 'scripts/refine-dashboard-ui.py'
      - '.github/workflows/apply-targeted-ui-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply deterministic UI fixes
        run: python3 scripts/apply-ui-regression-fixes.py

      - name: Refine dashboard budget and export UX
        run: python3 scripts/refine-dashboard-ui.py

      - name: Validate JavaScript
        run: |
          node --check frontend/js/ui-regression-fixes.js
          node --check frontend/js/dashboard.js
          node --check frontend/js/theme-performance.js

      - name: Commit source fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix(ui): refine budget status export native dialogs refresh and theme performance'
          git push origin HEAD:main
