name: Apply Targeted UI Fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-ui-regression-fixes.py'
      - 'scripts/refine-dashboard-ui.py'
      - 'scripts/refactor-dashboard-js.py'
      - '.github/workflows/apply-targeted-ui-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply deterministic UI fixes
        run: python3 scripts/apply-ui-regression-fixes.py

      - name: Refine dashboard budget and export UX
        run: python3 scripts/refine-dashboard-ui.py

      - name: Refactor dashboard JavaScript
        run: python3 scripts/refactor-dashboard-js.py

      - name: Validate JavaScript
        run: |
          find frontend/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Commit source fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'refactor(ui): modularize dashboard javascript and stabilize mobile actions'
          git push origin HEAD:main
