name: Apply Release Stabilization Fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-release-fixes.py'
      - '.github/workflows/apply-release-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and apply deterministic fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply-release-fixes.py
          python3 scripts/apply-release-fixes.py

      - name: Commit source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git add frontend/js/dashboard.js frontend/js/modules/dashboard-utils.js frontend/dashboard.html frontend/css/ui-regression-fixes.css
          git commit -m 'fix(ui): stabilize dashboard runtime and mobile controls'
          git push origin HEAD:main
