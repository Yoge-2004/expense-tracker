name: Apply Release Stabilization Fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-release-fixes.py'
      - 'scripts/web-ui-fixes.py'
      - 'scripts/web-polish-fixes.py'
      - 'scripts/apply-ui-regression-fixes.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply deterministic source fixes
        run: |
          python3 scripts/apply-release-fixes.py
          python3 scripts/web-ui-fixes.py
          python3 scripts/web-polish-fixes.py
          python3 scripts/apply-ui-regression-fixes.py

      - name: Commit source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git add frontend
          git commit -m 'fix(ui): repair auth controls mobile layout and dashboard refresh'
          git push origin HEAD:main

      - name: Dispatch verification and deployment workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref main
          gh workflow run android-apk.yml --ref main
          gh workflow run deploy-backend-hf.yml --ref main
          echo 'Dispatched CI, Android release, and Hugging Face backend deployment.'
