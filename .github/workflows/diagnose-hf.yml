name: Diagnose Hugging Face failover

# Temporary diagnostic. Reads the live Space's state and prints a REDACTED summary as annotations.
# Output of a workflow run is public, so nothing personal or secret is printed.
on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      HF_SPACE_REPO: Yoge-2004/expense-tracker-backend
      SPACE_URL: https://yoge-2004-expense-tracker-backend.hf.space
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -q huggingface_hub requests
      - name: Inspect the Space
        shell: python
        run: |
          import os, re, time, json
          import requests
          from huggingface_hub import HfApi

          def redact(s):
              s = re.sub(r'[\w.+-]+@[\w-]+\.[\w.-]+', '<email>', s)
              s = re.sub(r'\b\d{1,3}(?:\.\d{1,3}){3}\b', '<ip>', s)
              s = re.sub(r'eyJ[\w-]+\.[\w-]+\.[\w-]+', '<jwt>', s)
              s = re.sub(r'[A-Za-z0-9_\-]{32,}', '<token>', s)
              s = re.sub(r'(password|secret|token|key)=\S+', r'\1=<hidden>', s, flags=re.I)
              return s[:230]

          def note(title, lines):
              text = '\n'.join(lines).replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::notice title={title}::{text}')

          repo, url, token = os.environ['HF_SPACE_REPO'], os.environ['SPACE_URL'], os.environ.get('HF_TOKEN')
          api = HfApi(token=token)

          # 1. health endpoint
          out = []
          try:
              r = requests.get(url + '/api/health', timeout=60)
              out.append(f'HTTP {r.status_code}')
              out.append(redact(r.text.replace('\n', ' ')))
          except Exception as e:
              out.append('health request failed: ' + redact(f'{type(e).__name__}: {e}'))
          note('1 Space /api/health', out)

          # 2. runtime
          out = []
          try:
              rt = api.get_space_runtime(repo)
              out.append(f'stage={rt.stage} hardware={rt.hardware} requested={rt.requested_hardware}')
              out.append(f'storage={getattr(rt, "storage", None)} sleep_time={getattr(rt, "sleep_time", None)}')
              out.append(f'raw={redact(json.dumps(rt.raw)[:600])}')
          except Exception as e:
              out.append(redact(f'{type(e).__name__}: {e}'))
          note('2 Space runtime', out)

          # 3. snapshot file in the Space repo
          out = []
          try:
              for entry in api.list_repo_tree(repo_id=repo, repo_type='space', path_in_repo='database', recursive=True):
                  size = getattr(entry, 'size', None)
                  last = getattr(entry, 'last_commit', None)
                  out.append(f'{entry.path} size={size} lfs={bool(getattr(entry, "lfs", None))} last_commit={getattr(last, "date", None)}')
              if not out:
                  out.append('database/ folder is EMPTY or missing in the Space repo')
          except Exception as e:
              out.append('database/ not listed: ' + redact(f'{type(e).__name__}: {e}'))
          try:
              info = api.get_paths_info(repo, ['database/expense_tracker.sqlite.enc'], repo_type='space', expand=True)
              for i in info:
                  out.append(f'MAIN {i.path} size={getattr(i, "size", None)} last_commit={getattr(getattr(i, "last_commit", None), "date", None)}')
          except Exception as e:
              out.append('main snapshot: ' + redact(f'{type(e).__name__}: {e}'))
          out = [l for l in out if not l.startswith('database/backups/')][:6] + [f'({len([1 for _ in out])} lines total)']
          note('3 Snapshot files in the Space repo', out)

          # 1b. is the container itself alive? /health is served by the ML service through nginx
          out = []
          for path in ('/health', '/api/health', '/'):
              try:
                  t = time.time()
                  r = requests.get(url + path, timeout=130)
                  out.append(f'{path}: HTTP {r.status_code} in {time.time() - t:.1f}s {redact(r.text[:160].replace(chr(10), " "))}')
              except Exception as e:
                  out.append(f'{path}: {type(e).__name__} after {time.time() - t:.0f}s')
          note('1b Probes', out)

          # 4. runtime logs, filtered and redacted
          lines, info = [], []
          for endpoint in (f'https://api.hf.space/v1/{repo}/logs/run', f'https://huggingface.co/api/spaces/{repo}/logs/run'):
              try:
                  r = requests.get(endpoint, headers={'Authorization': f'Bearer {token}', 'Accept': 'text/event-stream'}, stream=True, timeout=(20, 30))
                  info.append(f'{endpoint.split("/")[2]} -> HTTP {r.status_code} {r.headers.get("content-type", "")[:30]}')
                  start = time.time()
                  for raw in r.iter_lines(decode_unicode=True):
                      if raw and raw.startswith('data:'):
                          try:
                              lines.append(json.loads(raw[5:]).get('data', ''))
                          except Exception:
                              lines.append(raw[5:])
                      if time.time() - start > 30 or len(lines) > 6000:
                          break
                  if lines:
                      break
              except Exception as e:
                  info.append(f'{endpoint.split("/")[2]} -> {type(e).__name__}')
          note('4a log stream', info)
          ansi = re.compile(r'\x1b\[[0-9;]*m')
          clean = [ansi.sub('', l).strip() for l in lines]
          stamps = [l[:23] for l in clean if re.match(r'^\d{4}-\d\d-\d\d \d\d:\d\d', l)]
          note('4b log window', [f'{len(lines)} lines; first {stamps[0] if stamps else "?"}; last {stamps[-1] if stamps else "?"}'])
          def short(l):
              l = re.sub(r'\[traceId=[^\]]*\]\s*\[user=[^\]]*\]\s*', '', l)
              l = re.sub(r'^\S+ (\S+) ', r'\1 ', l)
              return redact(l)[:210]
          marks = re.compile(r'Started |Tomcat|Netty|entering|emergency|fallback|Fallback|snapshot|Snapshot|failover|Failover|mirror|Exception|ERROR|FATAL|Caused by|Unable|timed out|Timeout|exhausted|quota|too many|blocked|virtual|pinned|OutOfMemory|GC', re.I)
          seen, uniq = set(), []
          for l in clean:
              if marks.search(l):
                  key = re.sub(r'\d+', '#', re.sub(r'^\S+ \S+ ', '', l))[:70]
                  if key not in seen:
                      seen.add(key); uniq.append(short(l))
          note(f'4c unique notable log lines ({len(uniq)})', ['first 14 (startup sequence):'] + uniq[:14])
          for i in range(14, min(len(uniq), 14 + 60), 12):
              note(f'4d more unique lines {i}', uniq[i:i + 12])
