name: One-off dashboard enhancements semantic split
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  split:
    if: "!contains(github.event.head_commit.message, '[dashboard-enhancements-split]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split dashboard enhancements by responsibility
        shell: python
        run: |
          from pathlib import Path

          root = Path('frontend/css')
          source = root / 'dashboard' / 'enhancements.css'
          text = source.read_text(encoding='utf-8')

          boundaries = [
              ('.skeleton {', 'loading.css'),
              ('[data-theme="light"] .modal {', 'modal-polish.css'),
              ('.top-bar {', 'topbar.css'),
              ('.budget-bar-track {', 'budget.css'),
              ('@keyframes menuDown {', 'navigation.css'),
              ('.toast {', 'feedback.css'),
              ('@media (min-width: 901px) {', 'auth-hero-support.css'),
              ('.insight-card,\n.trend-card {', 'insights.css'),
              ('.badge-primary {', 'badges.css'),
              ('#addExpenseForm .form-group input,', 'form-behavior.css'),
              ('.scroll-area,\n.scroll-area-modal {', 'scroll-loading.css'),
              ('@keyframes filterSlide {', 'filter-panel.css'),
          ]

          indexes = []
          for anchor, filename in boundaries:
              index = text.find(anchor)
              if index < 0:
                  raise SystemExit(f'Missing semantic boundary: {anchor!r}')
              indexes.append((index, anchor, filename))

          if any(indexes[i][0] >= indexes[i + 1][0] for i in range(len(indexes) - 1)):
              raise SystemExit('Semantic boundaries are not strictly ordered; refusing to modify.')

          # Keep the original order exactly: the first module includes the file preamble,
          # then each following module begins at its semantic boundary.
          chunks = []
          for i, (start, _anchor, filename) in enumerate(indexes):
              end = indexes[i + 1][0] if i + 1 < len(indexes) else len(text)
              if i == 0:
                  content = text[:end]
              else:
                  content = text[start:end]
              chunks.append((filename, content))

          out_dir = root / 'dashboard' / 'enhancements'
          out_dir.mkdir(exist_ok=True)
          for filename, content in chunks:
              (out_dir / filename).write_text(content.rstrip() + '\n', encoding='utf-8')

          manifest = (
              '/* EXPENSE TRACKER — DASHBOARD ENHANCEMENTS */\n'
              '/* Domain modules preserve the original cascade order while narrowing ownership. */\n'
              + ''.join(f'@import url("dashboard/enhancements/{filename}");\n' for _, _, filename in indexes)
          )
          source.write_text(manifest, encoding='utf-8')

          for filename, content in chunks:
              if content.count('{') != content.count('}'):
                  raise SystemExit(f'Unbalanced braces in generated chunk {filename}')

          if source.read_text(encoding='utf-8').count('@import') != len(chunks):
              raise SystemExit('Dashboard enhancements manifest does not match generated modules')

      - name: Remove one-off workflow
        run: rm .github/workflows/one-off-dashboard-enhancements-split.yml

      - name: Commit semantic split
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/css/dashboard/enhancements.css frontend/css/dashboard/enhancements/
          git rm .github/workflows/one-off-dashboard-enhancements-split.yml
          git diff --cached --check
          git commit -m 'refactor(css): split dashboard enhancements by responsibility [dashboard-enhancements-split]'
          git push
