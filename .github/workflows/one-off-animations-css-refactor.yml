name: One-off animations CSS refactor
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refactor:
    if: "!contains(github.event.head_commit.message, '[animation-refactor]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Split animation system into focused modules
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('frontend/css')
          source_path = root / 'animations.css'
          source = source_path.read_text(encoding='utf-8')

          if source.count('{') != source.count('}'):
              raise SystemExit(
                  f'animations.css has unbalanced braces: '
                  f'{source.count("{")} opens vs {source.count("}")} closes'
              )

          # Remove the malformed dangling selector that accidentally widened
          # the following .btn-edit:active rule to the idle .btn-edit state.
          source = source.replace('.btn-edit,\n\n\n\n\n.btn-edit:active {', '.btn-edit:active {')

          # Remove exact duplicate keyframe definition; the first definition
          # remains in the same cascade position and is behaviorally identical.
          duplicate_shimmer = '''@keyframes shimmerSweep {\n    0% { background-position: -200% 0; }\n    100% { background-position: 200% 0; }\n}\n'''
          occurrences = source.count(duplicate_shimmer)
          if occurrences != 2:
              raise SystemExit(f'Expected exactly 2 shimmerSweep definitions, found {occurrences}')
          source = source.replace(duplicate_shimmer, '', 1)

          # Remove known empty/dead section scaffolding left by earlier passes.
          dead_fragments = [
              '/* --- Dashboard entrance --- */\n\n\n/* --- Cards --- */\n\n\n',
              '/* --- Icon buttons --- */\n\n\n',
              '/* --- Expense list items --- */\n\n\n',
              '/* --- Modals --- */\n\n\n\n',
              '/* --- Profile menu --- */\n\n\n',
              '/* --- Filter panel slide-down --- */\n\n\n',
              '/* --- Budget items entrance --- */\n\n\n',
              '/* Prominent Card & Panel Styles */\n\n\n',
              '/* 52. Liquid Glow Undulation */\n\n\n\n',
              '/* 99. Search Bar Stretch on Focus */\n',
              '.metric-card {\n}\n\n\n',
          ]
          for fragment in dead_fragments:
              source = source.replace(fragment, '')

          # Split only at stable major-section boundaries so declaration order
          # remains identical after modularization.
          markers = [
              ('high-impact.css', '/* ================== HIGH-IMPACT PROMINENT ANIMATIONS ================== */'),
              ('insights.css', '/* =============================================================================\n   10. SMART FINANCIAL INSIGHTS INTELLIGENCE PANEL\n============================================================================= */'),
              ('ambient.css', '/* =============================================================================\n   11. AMBIENT ANIMATED BACKGROUND & MICRO-ANIMATIONS\n============================================================================= */'),
              ('advanced.css', '/* ==========================================================================\n   SUPER-CHARGED 17+ ANIMATIONS SYSTEM (60FPS HARDWARE-ACCELERATED)\n   ========================================================================== */'),
              ('global.css', '/* ==========================================================================\n   GLOBAL INTERACTION & CASCADE ANIMATIONS ACROSS ALL PAGES\n   ========================================================================== */'),
          ]

          positions = []
          cursor = 0
          for name, marker in markers:
              pos = source.find(marker, cursor)
              if pos == -1:
                  raise SystemExit(f'Missing expected section marker: {name}')
              positions.append((name, pos, marker))
              cursor = pos + len(marker)

          preamble = source[:positions[0][1]].rstrip() + '\n'
          chunks = {'foundation.css': preamble}
          for i, (name, pos, marker) in enumerate(positions):
              end = positions[i + 1][1] if i + 1 < len(positions) else len(source)
              chunk = source[pos:end].strip() + '\n'
              chunks[name] = chunk

          out_dir = root / 'animations'
          out_dir.mkdir(parents=True, exist_ok=True)
          for filename, content in chunks.items():
              (out_dir / filename).write_text(content, encoding='utf-8')

          manifest = '''/* ==========================================================================\n   EXPENSE TRACKER — ANIMATIONS.CSS\n   Module entry point for focused animation and micro-interaction layers.\n   Declaration order matches the pre-refactor cascade.\n   ========================================================================== */\n\n@import url("animations/foundation.css");\n@import url("animations/high-impact.css");\n@import url("animations/insights.css");\n@import url("animations/ambient.css");\n@import url("animations/advanced.css");\n@import url("animations/global.css");\n'''
          source_path.write_text(manifest, encoding='utf-8')

          # The surgical compatibility file is no longer necessary after the
          # malformed selector is removed from the source module.
          fixes = root / 'animations-fixes.css'
          if fixes.exists():
              fixes.unlink()

          # Remove the now-obsolete compatibility import from the master sheet.
          style_path = root / 'style.css'
          style = style_path.read_text(encoding='utf-8')
          style = style.replace('@import url("animations-fixes.css");\n', '')
          style_path.write_text(style, encoding='utf-8')

          # Validate every generated module and the manifest.
          for path in [source_path, style_path, *sorted(out_dir.glob('*.css'))]:
              text = path.read_text(encoding='utf-8')
              if text.count('{') != text.count('}'):
                  raise SystemExit(
                      f'{path} has unbalanced braces: '
                      f'{text.count("{")} opens vs {text.count("}")} closes'
                  )

          expected = ['foundation.css', 'high-impact.css', 'insights.css', 'ambient.css', 'advanced.css', 'global.css']
          actual = [p.name for p in sorted(out_dir.glob('*.css'))]
          if actual != sorted(expected):
              raise SystemExit(f'Unexpected animation module set: {actual}')

      - name: Verify refactor diff
        run: |
          git diff --check
          test -f frontend/css/animations.css
          test -f frontend/css/animations/foundation.css
          test -f frontend/css/animations/high-impact.css
          test -f frontend/css/animations/insights.css
          test -f frontend/css/animations/ambient.css
          test -f frontend/css/animations/advanced.css
          test -f frontend/css/animations/global.css
          ! test -f frontend/css/animations-fixes.css
          ! grep -q 'animations-fixes.css' frontend/css/style.css

      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/css .github/workflows/one-off-animations-css-refactor.yml
          git add -u frontend/css/animations-fixes.css frontend/css/style.css frontend/css/animations.css
          git diff --cached --check
          git commit -m 'refactor(css): modularize animation system [animation-refactor]'
          git push
