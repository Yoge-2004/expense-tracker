# Weekly dependency update pull requests, grouped so one ecosystem opens one or two PRs, not dozens.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "build(deps)" }
    groups:
      maven-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "build(deps)" }
    groups:
      mobile-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    commit-message: { prefix: "build(deps)" }
    groups:
      e2e-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /ml
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    commit-message: { prefix: "build(deps)" }
    groups:
      ml-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
