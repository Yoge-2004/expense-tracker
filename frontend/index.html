<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login | Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
    <meta name="description"
        content="Track your daily expenses, analyze spending habits, and manage your budget effortlessly with our professional Expense Tracker dashboard.">
    <meta name="keywords"
        content="expense tracker, budget manager, personal finance, money management, spending analysis, financial dashboard">
    <meta name="author" content="Your Name or Company">
    <meta name="robots" content="index, follow">

    <meta name="theme-color" content="#05070D">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://your-website-url.com/">
    <meta property="og:title" content="Expense Tracker - Master Your Money">
    <meta property="og:description"
        content="Track, analyze, and optimize your spending habits with our professional dashboard.">
    <meta property="og:image"
        content="https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=1200&auto=format&fit=crop">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://your-website-url.com/">
    <meta property="twitter:title" content="Expense Tracker - Master Your Money">
    <meta property="twitter:description"
        content="Track, analyze, and optimize your spending habits with our professional dashboard.">
    <meta property="twitter:image"
        content="https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=1200&auto=format&fit=crop">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <div class="split-screen">
        <section class="hero-section">
            <div class="hero-content">
                <h1>Master your<br>money today.</h1>
                <p>Track, analyze, and optimize your spending habits with our professional dashboard.</p>
            </div>
        </section>

        <section class="auth-section">
            <div class="auth-card">

                <div class="brand-logo">
                    <span>✦</span> Expense Tracker
                </div>

                <h2>Welcome back</h2>
                <span class="muted">Sign in to manage your account</span>

                <form id="loginForm">
                    <div class="field">
                        <input type="email" id="email" required placeholder=" ">
                        <label>Email Address</label>
                    </div>

                    <div class="field">
                        <div class="password-wrapper">
                            <input type="password" id="password" required placeholder=" " style="padding-right: 40px;">
                            <label>Password</label>
                            <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password" title="Show password">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                            </button>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: flex-end; margin-bottom: 24px;">
                        <a href="forgot-password.html" style="font-size: 13px; color: #FF9F6E;">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-primary">Sign In</button>
                </form>

                <div class="oauth-divider">
                    <span>or sign in with</span>
                </div>

                <button type="button" class="btn-oauth" onclick="handleGoogleOAuth()">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                    Continue with Google
                </button>

                <p style="margin-top: 24px; text-align: center; color: #9AA0AE; font-size: 14px;">
                    Don't have an account? <a href="register.html" style="color: #fff; font-weight: 600;">Register</a>
                </p>
            </div>
        </section>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/password-toggle.js"></script>
</body>

</html>
