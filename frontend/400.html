<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Unified Theme-Adaptive Brand Favicons -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <title>ExpenseTracker PRO — 400 Bad Request</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10120E">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <script>
        (function () {
            try {
                const t = localStorage.getItem("theme") || "dark";
                document.documentElement.setAttribute("data-theme", t);
                const m = document.querySelector('meta[name="theme-color"]');
                if (m) m.setAttribute("content", t === "light" ? "#F8F9FA" : "#10120E");
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="css/error-pages.css">
</head>
<body>
    <div class="ambient-glow" aria-hidden="true"></div>

    <div class="top-nav-row">
        <a href="index.html" class="brand-top-bar" title="ExpenseTracker PRO Home">
            <div class="brand-logo-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10120E" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            </div>
            <span class="brand-heading-text">ExpenseTracker <span class="brand-pro-tag">PRO</span></span>
        </a>
        <button type="button" class="theme-toggle-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
            <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
    </div>

    <div class="error-card">
        <div class="error-badge">
            <span class="status-dot"></span>
            <span>HTTP 400 &bull; Invalid Request Syntax</span>
        </div>
        <div class="error-code-num">400</div>
        <h1 class="error-headline">Bad Request</h1>
        <p class="error-desc">The server could not process the request because the syntax, headers, or query parameters were malformed.</p>
        <div class="error-btn-group">
            <a href="dashboard.html" class="btn-act-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Dashboard</span>
            </a>
            <a href="index.html" class="btn-act-secondary">
                <span>Sign In / Home</span>
            </a>
            <button type="button" id="retryErrorPageBtn" class="btn-act-secondary" title="Reload this page">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                <span>Retry</span>
            </button>
        </div>
    </div>

    <script>
        document.getElementById("retryErrorPageBtn")?.addEventListener("click", function () { location.reload(); });
        document.getElementById("themeToggle")?.addEventListener("click", function () {
            const current = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", current);
            try { localStorage.setItem("theme", current); } catch (e) {}
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", current === "light" ? "#F8F9FA" : "#10120E");
        });
    </script>
</body>
</html>
