<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Unified Theme-Adaptive Brand Favicons -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <title>ExpenseTracker PRO — 400 Bad Request</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10120E">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <script>
        (function () {
            try {
                const t = localStorage.getItem("theme") || "dark";
                document.documentElement.setAttribute("data-theme", t);
                const m = document.querySelector('meta[name="theme-color"]');
                if (m) m.setAttribute("content", t === "light" ? "#F8F9FA" : "#10120E");
            } catch (e) {}
        })();
    </script>
    <style>
        :root {
            --bg-main: #10120E;
            --text-main: #EDEDEC;
            --text-muted: #9E9E9C;
            --card-bg: rgba(23, 26, 20, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #C79A3E;
            --primary-rgb: 199, 154, 62;
            --cursor-default: auto;
            --cursor-pointer: pointer;
        }
        [data-theme="light"] {
            --bg-main: #F8F9FA;
            --text-main: #1D1D1F;
            --text-muted: #6E6E73;
            --card-bg: rgba(255, 255, 255, 0.94);
            --border: rgba(0, 0, 0, 0.09);
            --primary: #B48C3C;
            --primary-rgb: 180, 140, 60;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background-color: var(--bg-main, #10120E);
            color: var(--text-main, #EDEDEC);
            font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            position: relative;
            overflow-x: hidden;
            cursor: var(--cursor-default, auto);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(var(--primary-rgb, 199, 154, 62), 0.12) 0%, rgba(162, 62, 50, 0.04) 45%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
            animation: ambientGlowPulse 6s ease-in-out infinite alternate;
        }
        @keyframes ambientGlowPulse {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
        }
        .top-nav-row {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 520px;
            margin-bottom: 24px;
        }
        .brand-top-bar {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            cursor: var(--cursor-pointer, pointer);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .brand-top-bar:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }
        .brand-logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #C79A3E 0%, #A23E32 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(199, 154, 62, 0.35);
        }
        .brand-heading-text {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main, #EDEDEC);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s ease;
        }
        .brand-pro-tag {
            font-size: 11px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
            background: #C79A3E;
            color: #10120E;
            letter-spacing: 0.06em;
        }
        .theme-toggle-btn {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            border: 1px solid var(--border, rgba(255, 255, 255, 0.1));
            background: var(--card-bg, rgba(255, 255, 255, 0.04));
            color: var(--text-main, #EDEDEC);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: var(--cursor-pointer, pointer);
            transition: all 0.2s ease;
        }
        .theme-toggle-btn:hover {
            border-color: var(--primary, #C79A3E);
            transform: translateY(-1px);
        }
        .theme-toggle-btn .sun-icon { display: none; }
        .theme-toggle-btn .moon-icon { display: block; }
        [data-theme="light"] .theme-toggle-btn .sun-icon { display: block; }
        [data-theme="light"] .theme-toggle-btn .moon-icon { display: none; }

        .error-card {
            position: relative;
            z-index: 1;
            max-width: 520px;
            width: 100%;
            background: var(--card-bg, rgba(23, 26, 20, 0.85));
            border: 1px solid var(--border, rgba(255, 255, 255, 0.08));
            border-radius: 24px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: errorCardEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        [data-theme="light"] .error-card {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.07), 0 0 0 1px rgba(180, 140, 60, 0.15);
        }
        @keyframes errorCardEntrance {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(var(--primary-rgb, 199, 154, 62), 0.25);
            color: var(--primary, #C79A3E);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        [data-theme="light"] .error-badge {
            background: rgba(var(--primary-rgb, 180, 140, 60), 0.08);
            border-color: rgba(var(--primary-rgb, 180, 140, 60), 0.25);
            color: #8C6A20;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary, #C79A3E);
            display: inline-block;
            box-shadow: 0 0 8px var(--primary, #C79A3E);
            animation: statusDotPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes statusDotPulse {
            0% { box-shadow: 0 0 0 0 rgba(var(--primary-rgb, 199, 154, 62), 0.6); }
            70% { box-shadow: 0 0 0 8px rgba(var(--primary-rgb, 199, 154, 62), 0); }
            100% { box-shadow: 0 0 0 0 rgba(var(--primary-rgb, 199, 154, 62), 0); }
        }
        .error-code-num {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 64px;
            font-weight: 600;
            line-height: 1;
            margin: 0 0 8px;
            color: var(--text-main, #EDEDEC);
            letter-spacing: -0.03em;
            display: inline-block;
            animation: errorCodeFloat 3.5s ease-in-out infinite alternate;
            will-change: transform;
            transition: color 0.3s ease;
        }
        @keyframes errorCodeFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }
        .error-headline {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main, #EDEDEC);
            margin: 0 0 12px;
            transition: color 0.3s ease;
        }
        .error-desc {
            color: var(--text-muted, #9E9E9C);
            font-size: 14px;
            line-height: 1.6;
            margin: 0 auto 32px;
            max-width: 420px;
            transition: color 0.3s ease;
        }
        .error-btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 360px;
            margin: 0 auto;
        }
        @media (min-width: 480px) {
            .error-btn-group {
                flex-direction: row;
                justify-content: center;
            }
        }
        .btn-act-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 12px;
            background: var(--primary, #C79A3E);
            color: #10120E;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            border: none;
            cursor: var(--cursor-pointer, pointer);
            transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s ease, background 0.22s ease;
            box-shadow: 0 4px 16px rgba(199, 154, 62, 0.25);
        }
        .btn-act-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(199, 154, 62, 0.4);
        }
        .btn-act-primary:active {
            transform: translateY(0) scale(0.98);
        }
        .btn-act-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border, rgba(255, 255, 255, 0.12));
            color: var(--text-main, #EDEDEC);
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            cursor: var(--cursor-pointer, pointer);
            transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), background 0.22s ease, border-color 0.22s ease, color 0.22s ease, box-shadow 0.22s ease;
        }
        [data-theme="light"] .btn-act-secondary {
            background: rgba(0, 0, 0, 0.04);
            border-color: var(--border, rgba(0, 0, 0, 0.12));
            color: var(--text-main, #1D1D1F);
        }
        .btn-act-secondary:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(var(--primary-rgb, 199, 154, 62), 0.4);
            color: var(--primary, #C79A3E);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }
        [data-theme="light"] .btn-act-secondary:hover {
            background: rgba(0, 0, 0, 0.08);
            border-color: rgba(var(--primary-rgb, 180, 140, 60), 0.4);
            color: var(--primary, #B48C3C);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }
        .btn-act-secondary:active {
            transform: translateY(0) scale(0.98);
        }
        @media (prefers-reduced-motion: reduce) {
            .error-card,
            .error-code-num,
            .status-dot,
            .ambient-glow {
                animation: none !important;
            }
            .btn-act-primary:hover,
            .btn-act-secondary:hover {
                transform: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-glow" aria-hidden="true"></div>

    <div class="top-nav-row">
        <a href="index.html" class="brand-top-bar" title="ExpenseTracker PRO Home">
            <div class="brand-logo-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10120E" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            </div>
            <span class="brand-heading-text">ExpenseTracker <span class="brand-pro-tag">PRO</span></span>
        </a>
        <button type="button" class="theme-toggle-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
            <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
    </div>

    <div class="error-card">
        <div class="error-badge">
            <span class="status-dot"></span>
            <span>HTTP 400 &bull; Invalid Request Syntax</span>
        </div>
        <div class="error-code-num">400</div>
        <h1 class="error-headline">Bad Request</h1>
        <p class="error-desc">The server could not process the request because the syntax, headers, or query parameters were malformed.</p>
        <div class="error-btn-group">
            <a href="dashboard.html" class="btn-act-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Dashboard</span>
            </a>
            <a href="index.html" class="btn-act-secondary">
                <span>Sign In / Home</span>
            </a>
            <button type="button" onclick="location.reload()" class="btn-act-secondary" title="Reload this page">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                <span>Retry</span>
            </button>
        </div>
    </div>

    <script>
        document.getElementById("themeToggle")?.addEventListener("click", function () {
            const current = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", current);
            try { localStorage.setItem("theme", current); } catch (e) {}
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", current === "light" ? "#F8F9FA" : "#10120E");
        });
    </script>
</body>
</html>
